<style>
/* Layout: one narrow column like a case folder; the paper "dossier card" is the only light object on a night-indigo desk.
   Each game swaps the lamp accent: amber for Undercover, teal for Spyfall. Single dark look by choice. */
:root {
  --desk: #141830;
  --desk-2: #1c2142;
  --line: #2f3663;
  --fg: #e9ebf5;
  --muted: #9aa0c3;
  --paper: #efe7d4;
  --paper-ink: #2a2418;
  --lamp: #f0b443;
  --lamp-ink: #2a1d05;
  --uc: #f0b443;
  --sf: #4fc9c0;
  --spy: #e5604a;
  --ghost: #c9ccdf;
  --civ: #6fc3a8;
  --f-stamp: "Saira Stencil One", Impact, "Arial Black", sans-serif;
  --f-head: "Saira Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
.theme-sf { --lamp: var(--sf); --lamp-ink: #052220; }
html, body { min-height: 100%; }
body {
  background: var(--desk);
  background-image: radial-gradient(ellipse 90% 50% at 50% -10%, #2b3170 0%, transparent 70%);
  background-attachment: fixed;
  color: var(--fg);
  font: 16px/1.5 var(--f-body);
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.brand { display: flex; flex-direction: column; gap: 4px; }
.brand-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--f-stamp); font-size: clamp(2.3rem, 11vw, 3.4rem); line-height: .95; letter-spacing: .02em; color: var(--lamp); }
.tag { color: var(--muted); font-size: .95rem; }
.back { align-self: flex-start; color: var(--muted); font-weight: 600; font-size: .92rem; padding: 4px 0; }
.back:hover { color: var(--fg); }
.eyebrow { font-family: var(--f-head); font-weight: 600; text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; color: var(--muted); }
.title { font-family: var(--f-head); font-weight: 800; font-size: 1.9rem; line-height: 1.05; text-transform: uppercase; letter-spacing: .02em; }
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.panel { background: var(--desk-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.hint { color: var(--muted); font-size: .9rem; }
.err { color: var(--spy); font-weight: 600; font-size: .95rem; }

/* controls */
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: 12px; font-family: var(--f-head); font-weight: 800; font-size: 1.15rem; letter-spacing: .06em; text-transform: uppercase; transition: transform .08s ease, opacity .15s; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .35; cursor: not-allowed; }
.btn-main { background: var(--lamp); color: var(--lamp-ink); width: 100%; }
.btn-ghost { border: 1.5px solid var(--line); color: var(--fg); }
.btn-danger { background: var(--spy); color: #fff; width: 100%; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 140px; }
.link { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: .92rem; padding: 6px 0; }
input[type=text] { width: 100%; min-width: 0; min-height: 46px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--desk); color: var(--fg); font: inherit; }
input[type=text]::placeholder { color: #6a7099; }

/* players */
.plist { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.prow { display: grid; grid-template-columns: 26px 1fr 44px; align-items: center; gap: 8px; }
.seat { font-family: var(--f-head); font-weight: 800; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.x { width: 44px; height: 46px; border-radius: 10px; color: var(--muted); font-size: 1.4rem; line-height: 1; }
.x:hover { color: var(--spy); }
.roster { display: flex; flex-wrap: wrap; gap: 6px; }
.roster span { padding: 4px 10px; border-radius: 99px; background: var(--desk); border: 1px solid var(--line); font-size: .9rem; font-weight: 600; }

/* hub game cards */
.games { display: flex; flex-direction: column; gap: 12px; }
.game { --acc: var(--uc); position: relative; text-align: left; background: var(--desk-2); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
.game::after { content: ""; position: absolute; right: -30px; top: -30px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--acc) 30%, transparent), transparent 70%); pointer-events: none; }
.game.g-sf { --acc: var(--sf); }
.game:hover { border-color: var(--acc); }
.game .gname { font-family: var(--f-stamp); font-size: 2rem; line-height: 1; color: var(--acc); }
.game .gdesc { color: var(--fg); font-size: .98rem; max-width: 40ch; }
.game .gmeta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: .85rem; font-weight: 600; }
.game .gmeta .pill { background: var(--acc); }
.game .go { font-family: var(--f-head); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--acc); margin-top: 4px; }

/* steppers */
.roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.roles.two-up { grid-template-columns: repeat(2, 1fr); }
.role { background: var(--desk); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.role .n { font-family: var(--f-head); font-weight: 800; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.role .lbl { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.step { display: flex; gap: 6px; }
.step button { width: 38px; height: 34px; border-radius: 8px; border: 1px solid var(--line); font-size: 1.2rem; font-weight: 700; }
.step button[disabled] { opacity: .3; }
.c-civ { color: var(--civ); } .c-uc { color: var(--spy); } .c-mw { color: var(--ghost); } .c-lamp { color: var(--lamp); }

/* segmented */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--desk); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg.two-up { grid-template-columns: repeat(2, 1fr); }
.seg button { min-height: 42px; border-radius: 9px; font-weight: 600; font-size: .92rem; color: var(--muted); }
.seg button[aria-pressed=true] { background: var(--lamp); color: var(--lamp-ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* reveal grid */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.card { position: relative; min-height: 96px; border-radius: 12px; padding: 12px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; background: var(--paper); color: var(--paper-ink); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.card .nm { font-family: var(--f-head); font-weight: 800; font-size: 1.3rem; line-height: 1.05; text-transform: uppercase; overflow-wrap: anywhere; }
.card .st { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; opacity: .65; }
.card.seen { background: var(--desk-2); color: var(--muted); border: 1px dashed var(--line); box-shadow: none; }
.card.seen .st { color: var(--civ); opacity: 1; }

/* lists */
.order { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; counter-reset: o; }
.order li { counter-increment: o; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--desk-2); border: 1px solid var(--line); font-weight: 600; min-width: 0; }
.order li::before { content: counter(o); font-family: var(--f-head); font-weight: 800; color: var(--muted); width: 1.4em; text-align: right; font-variant-numeric: tabular-nums; }
.order li.first { border-color: var(--lamp); }
.order li .pill { margin-left: auto; }
.order li .job { margin-left: auto; color: var(--muted); font-weight: 500; font-size: .9rem; text-align: right; }
.pill { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; padding: 3px 8px; border-radius: 99px; background: var(--lamp); color: var(--lamp-ink); white-space: nowrap; }
.pill.civ { background: var(--civ); color: #0d2a22; }
.pill.uc, .pill.spy { background: var(--spy); color: #fff; }
.pill.mw { background: var(--ghost); color: #1a1c2a; }
.out-list { display: flex; flex-wrap: wrap; gap: 8px; }
.out-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
.out-chip s { text-decoration-thickness: 2px; }

/* vote / pick lists */
.vote { display: flex; flex-direction: column; gap: 8px; }
.vote button { min-height: 54px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--desk-2); text-align: left; font-weight: 600; font-size: 1.05rem; display: flex; align-items: center; justify-content: space-between; }
.vote button[aria-pressed=true] { border-color: var(--spy); background: color-mix(in srgb, var(--spy) 18%, var(--desk-2)); }
.vote button[aria-pressed=true]::after { content: attr(data-mark); font-family: var(--f-head); font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--spy); }

/* spyfall */
.clock { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 14px; background: var(--desk-2); border: 1px solid var(--line); border-radius: 16px; }
.timer { font-family: var(--f-stamp); font-size: clamp(4rem, 24vw, 6.5rem); line-height: 1; color: var(--lamp); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--spy); }
.timer.paused { opacity: .45; }
.locs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.locs > * { padding: 8px 10px; border-radius: 9px; background: var(--desk-2); border: 1px solid var(--line); font-size: .9rem; font-weight: 600; text-align: left; min-width: 0; overflow-wrap: anywhere; }
.locs button[aria-pressed=true] { border-color: var(--lamp); background: color-mix(in srgb, var(--lamp) 22%, var(--desk-2)); }

/* dossier (the hero object) */
.dossier { position: relative; background: var(--paper); color: var(--paper-ink); border-radius: 6px 6px 14px 14px; padding: 26px 20px 22px; box-shadow: 0 18px 40px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
.dossier::before { content: ""; position: absolute; top: -12px; left: 18px; width: 38%; height: 14px; background: var(--paper); border-radius: 8px 8px 0 0; }
.dossier .eyebrow { color: #7a6c50; }
.dossier .who { font-family: var(--f-head); font-weight: 800; font-size: clamp(1.8rem, 9vw, 2.6rem); line-height: 1; text-transform: uppercase; overflow-wrap: anywhere; }
.dossier .word { font-family: var(--f-stamp); font-size: clamp(2.2rem, 12vw, 3.6rem); line-height: 1; overflow-wrap: anywhere; padding: 6px 0; }
.dossier .job { font-family: var(--f-head); font-weight: 800; font-size: 1.4rem; text-transform: uppercase; }
.dossier .note { font-size: .95rem; color: #5a4f3a; max-width: 34ch; }
.stamp { font-family: var(--f-stamp); font-size: clamp(1.6rem, 8vw, 2.3rem); padding: 4px 14px; border: 4px solid currentColor; border-radius: 8px; transform: rotate(-4deg); display: inline-block; line-height: 1.1; }
.stamp.civ { color: #23866a; } .stamp.uc, .stamp.spy { color: #c23b25; } .stamp.mw { color: #3c3f58; }

/* sheet overlay */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--desk); display: flex; align-items: center; justify-content: center; padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-inner { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 22px; }
.flip { animation: flip .35s ease-out; }
@keyframes flip { from { transform: perspective(800px) rotateY(80deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* score */
.score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.score th { text-align: right; font-family: var(--f-head); font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: .75rem; color: var(--muted); padding: 0 4px 6px; }
.score th:first-child { text-align: left; }
.score td { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: right; }
.score td:first-child { text-align: left; overflow-wrap: anywhere; }
.score td:last-child { font-family: var(--f-head); font-weight: 800; font-size: 1.15rem; }
.score td.sub { color: var(--muted); }
.score tr:last-child td { border-bottom: 0; }
.score .plus { color: var(--civ); font-size: .85rem; font-weight: 700; margin-left: 6px; }

details { background: var(--desk-2); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
details summary { cursor: pointer; padding: 10px 0; font-weight: 600; list-style-position: inside; }
details[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 8px; }
details ol, details ul { margin: 0 0 12px; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
details b { color: var(--fg); }
details .locs { padding-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 12px; }
.chips button { padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line); font-weight: 600; font-size: .92rem; }
.center { text-align: center; align-items: center; }
.banner { font-family: var(--f-stamp); font-size: clamp(2rem, 10vw, 3rem); line-height: 1; color: var(--lamp); text-align: center; }
.words { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.words.one { grid-template-columns: 1fr; }
.words div { background: var(--desk-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.words b { display: block; font-family: var(--f-head); font-size: 1.4rem; text-transform: uppercase; overflow-wrap: anywhere; }

/* werewolf */
.theme-ww { --lamp: #b9a4ff; --lamp-ink: #1b1238; }
.game.g-ww { --acc: #b9a4ff; }
.ww-bar { display: flex; justify-content: flex-end; margin-top: -14px; }
.toggles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.toggle { min-height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--desk); font-weight: 600; color: var(--muted); }
.toggle[aria-pressed=true] { border-color: var(--lamp); color: var(--fg); background: color-mix(in srgb, var(--lamp) 16%, var(--desk)); }
.toggle[disabled] { opacity: .35; }
.toggle-card { color: inherit; }
.toggle-card[aria-pressed=true] { border-color: var(--lamp); }
.moon { width: 120px; height: 120px; border-radius: 50%; align-self: center; background: radial-gradient(circle at 38% 36%, #f4f1ff 0%, #d9d2f5 45%, #a99bd6 100%); box-shadow: 0 0 60px 10px rgba(185,164,255,.25); position: relative; }
.moon::after { content: ""; position: absolute; width: 22px; height: 22px; border-radius: 50%; background: rgba(120,105,170,.35); top: 54px; left: 30px; box-shadow: 38px -22px 0 -6px rgba(120,105,170,.3), 30px 22px 0 -8px rgba(120,105,170,.28); }
.moon.small { width: 72px; height: 72px; }
.moon.small::after { transform: scale(.6); transform-origin: 0 0; }
.sun { width: 90px; height: 90px; border-radius: 50%; align-self: center; background: radial-gradient(circle, #ffe7a3 0%, #f0b443 70%); box-shadow: 0 0 60px 16px rgba(240,180,67,.3); }
.ww-line { font-family: var(--f-head); font-weight: 800; font-size: clamp(1.5rem, 7vw, 2rem); line-height: 1.15; text-transform: uppercase; text-wrap: balance; min-height: 2.3em; }
.score th { font-size: .68rem; letter-spacing: .06em; }

@media (prefers-reduced-motion: reduce) { .flip { animation: none; } .btn { transition: none; } }
</style>

const KEY = "game-night.v1";
const OLD_KEY = "undercover-night.v1";

function fresh() {
  return {
    players: EXAMPLE_PLAYERS.slice(),
    scores: { uc: {}, sf: {}, ww: {} },
    screen: "hub",
    uc: { nUc: 1, nMw: 1, pack: "en", custom: { civ: "", uc: "" }, used: { en: [], id: [] }, game: null },
    sf: { spies: 1, minutes: 8, pack: "en", used: { en: [], id: [] }, game: null },
    ww: { wolves: null, seer: true, doc: true, hunter: false, reveal: true, voice: "en", sfx: true, talk: 3, muted: false, game: null }
  };
}
function load() {
  const f = fresh();
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      return Object.assign(f, d, {
        scores: Object.assign(f.scores, d.scores),
        uc: Object.assign(f.uc, d.uc),
        sf: Object.assign(f.sf, d.sf),
        ww: Object.assign(f.ww, d.ww)
      });
    }
    // Carry players and scores over from the standalone Undercover app.
    const old = localStorage.getItem(OLD_KEY);
    if (old) {
      const o = JSON.parse(old);
      if (Array.isArray(o.players) && o.players.length >= 3) f.players = o.players;
      if (o.scores) f.scores.uc = o.scores;
      if (o.uc != null) f.uc.nUc = o.uc;
      if (o.mw != null) f.uc.nMw = o.mw;
      if (o.pack) f.uc.pack = o.pack;
      if (o.custom) f.uc.custom = o.custom;
      if (o.used) f.uc.used = o.used;
    }
  } catch (e) {}
  return f;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rand = n => Math.floor(Math.random() * n);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
const top = () => window.scrollTo(0, 0);

// Picks an unused index from a pack, cycling once everything has been played.
function pickFresh(store, packKey, total) {
  let used = store[packKey] || [];
  if (used.length >= total) used = [];
  const left = [];
  for (let i = 0; i < total; i++) if (!used.includes(i)) left.push(i);
  const idx = left[rand(left.length)];
  store[packKey] = used.concat(idx);
  return idx;
}

function playerError() {
  const names = S.players.map(s => s.trim());
  if (names.length < 3) return "You need at least 3 players.";
  if (names.some(n => !n)) return "Every player needs a name.";
  const lower = names.map(n => n.toLowerCase());
  if (new Set(lower).size !== lower.length) return "Two players have the same name. Make each one different.";
  S.players = names;
  return "";
}

function addScore(game, name, pts) { S.scores[game][name] = (S.scores[game][name] || 0) + pts; }

let wakeLock = null;
async function keepAwake() {
  if (wakeLock || !("wakeLock" in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && (S.uc.game || S.sf.game)) keepAwake();
});

let actx = null;
function primeAudio() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {}
}
function alarm() {
  try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 400]); } catch (e) {}
  if (!actx) return;
  try {
    const t = actx.currentTime;
    [0, .35, .7].forEach(o => {
      const osc = actx.createOscillator(), g = actx.createGain();
      osc.frequency.value = 880; osc.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(.0001, t + o);
      g.gain.exponentialRampToValueAtTime(.3, t + o + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t + o + .28);
      osc.start(t + o); osc.stop(t + o + .3);
    });
  } catch (e) {}
}

const UC = {
  defaults(n) { return { nUc: n <= 6 ? 1 : n <= 9 ? 2 : 3, nMw: n <= 4 ? 0 : n <= 12 ? 1 : 2 }; },
  valid(n, uc, mw) {
    const civ = n - uc - mw;
    return uc >= 0 && mw >= 0 && uc + mw >= 1 && civ >= 2 && civ >= uc + mw;
  },
  resetCounts() {
    const n = S.players.length, d = this.defaults(n);
    if (this.valid(n, d.nUc, d.nMw)) Object.assign(S.uc, d);
    else Object.assign(S.uc, { nUc: 1, nMw: 0 });
  },
  secret(g, r) {
    if (r.role === "mw") return `<span class="stamp mw" style="margin:10px 0">MR. WHITE</span>
      <p class="note">You have no word. Listen to the clues, blend in, and work out what the civilians' word is.</p>`;
    return `<span class="note">Your word is</span>
      <span class="word">${esc(r.role === "civ" ? g.words.civ : g.words.uc)}</span>
      <p class="note">Keep it to yourself. Someone at the table has a slightly different word.</p>`;
  },

  start() {
    const C = S.uc;
    const pe = playerError(); if (pe) return fail(pe);
    const n = S.players.length;
    if (!this.valid(n, C.nUc, C.nMw)) this.resetCounts();
    if (C.pack === "custom") {
      if (!C.custom.civ.trim() || !C.custom.uc.trim()) return fail("Enter both custom words, or pick a word pack.");
      if (norm(C.custom.civ) === norm(C.custom.uc)) return fail("The two custom words need to be different.");
    }
    let words;
    if (C.pack === "custom") words = { civ: C.custom.civ.trim(), uc: C.custom.uc.trim() };
    else {
      const pairs = UC_PACKS[C.pack].pairs;
      let [a, b] = pairs[pickFresh(C.used, C.pack, pairs.length)].split("|");
      if (Math.random() < .5) [a, b] = [b, a];
      words = { civ: a, uc: b };
    }
    const roles = shuffle([...Array(C.nUc).fill("uc"), ...Array(C.nMw).fill("mw"), ...Array(n - C.nUc - C.nMw).fill("civ")]);
    C.game = {
      words, round: 1, phase: "reveal", order: [], lastOut: null, winner: null, awards: {},
      roles: S.players.map((name, i) => ({ name, role: roles[i], alive: true, seen: false }))
    };
    resetUi(); keepAwake(); save(); render(); top();
  },
  makeOrder() {
    const g = S.uc.game;
    const alive = g.roles.map((r, i) => i).filter(i => g.roles[i].alive);
    // Mr. White never opens the round.
    const starters = alive.filter(i => g.roles[i].role !== "mw");
    const k = alive.indexOf(starters[rand(starters.length)]);
    return alive.slice(k).concat(alive.slice(0, k));
  },
  counts() {
    const c = { civ: 0, uc: 0, mw: 0 };
    S.uc.game.roles.forEach(r => { if (r.alive) c[r.role]++; });
    return c;
  },
  checkWin() {
    const c = this.counts();
    if (c.uc + c.mw === 0) return "civ";
    if (c.civ <= 1) return "imp";
    return null;
  },
  finish(win) {
    const g = S.uc.game;
    g.winner = win; g.phase = "over"; g.awards = {};
    g.roles.forEach((r, i) => {
      let pts = 0;
      if (win === "civ" && r.role === "civ") pts = 2;
      if (win === "mw" && i === g.lastOut) pts = 6;
      if (win === "imp" && r.alive && r.role === "uc") pts = 10;
      if (win === "imp" && r.alive && r.role === "mw") pts = 6;
      if (pts) { g.awards[r.name] = pts; addScore("uc", r.name, pts); }
    });
  },
  nextRound() {
    const g = S.uc.game, win = this.checkWin();
    if (win) this.finish(win);
    else { g.round++; g.order = this.makeOrder(); g.phase = "clues"; }
    ui.sel = null; ui.guess = null; ui.guessText = "";
    save(); render(); top();
  },

  view() {
    const g = S.uc.game;
    if (!g) return this.vSetup();
    return this["v_" + g.phase]();
  },
  vSetup() {
    const C = S.uc, n = S.players.length;
    if (!this.valid(n, C.nUc, C.nMw)) this.resetCounts();
    const civ = n - C.nUc - C.nMw;
    const can = (u, m) => this.valid(n, u, m);
    return `
    ${gameHeader("UNDERCOVER", "Find the odd words out.")}
    ${rosterPanel()}
    <section class="section">
      <div class="section-head"><h2 class="title">Roles</h2><button class="link" data-act="ucAuto">Suggested mix</button></div>
      <div class="roles">
        <div class="role"><span class="n c-civ">${civ}</span><span class="lbl">Civilians</span><span class="hint" style="font-size:.75rem">the rest</span></div>
        <div class="role"><span class="n c-uc">${C.nUc}</span><span class="lbl">Undercover</span>
          <div class="step"><button data-act="ucStep" data-k="nUc" data-d="-1" aria-label="Fewer undercover" ${can(C.nUc - 1, C.nMw) ? "" : "disabled"}>&minus;</button><button data-act="ucStep" data-k="nUc" data-d="1" aria-label="More undercover" ${can(C.nUc + 1, C.nMw) ? "" : "disabled"}>+</button></div></div>
        <div class="role"><span class="n c-mw">${C.nMw}</span><span class="lbl">Mr. White</span>
          <div class="step"><button data-act="ucStep" data-k="nMw" data-d="-1" aria-label="Fewer Mr. White" ${can(C.nUc, C.nMw - 1) ? "" : "disabled"}>&minus;</button><button data-act="ucStep" data-k="nMw" data-d="1" aria-label="More Mr. White" ${can(C.nUc, C.nMw + 1) ? "" : "disabled"}>+</button></div></div>
      </div>
    </section>
    <section class="section">
      <h2 class="title">Words</h2>
      <div class="seg" role="group" aria-label="Word pack">
        <button data-act="ucPack" data-pack="en" aria-pressed="${C.pack === "en"}">English</button>
        <button data-act="ucPack" data-pack="id" aria-pressed="${C.pack === "id"}">Indonesia</button>
        <button data-act="ucPack" data-pack="custom" aria-pressed="${C.pack === "custom"}">Custom</button>
      </div>
      ${C.pack === "custom" ? `
        <p class="hint">Have someone who's sitting out type a pair of similar words.</p>
        <div class="two">
          <input type="text" id="cw-civ" data-custom="civ" value="${esc(C.custom.civ)}" placeholder="Civilian word" autocomplete="off" aria-label="Civilian word">
          <input type="text" id="cw-uc" data-custom="uc" value="${esc(C.custom.uc)}" placeholder="Undercover word" autocomplete="off" aria-label="Undercover word">
        </div>` : `<p class="hint">${UC_PACKS[C.pack].pairs.length} word pairs. A random pair is picked each game, with no repeats until the pack runs out.</p>`}
    </section>
    ${ui.err ? `<p class="err" role="alert">${esc(ui.err)}</p>` : ""}
    <button class="btn btn-main" data-act="ucStart">Deal the roles</button>
    <details>
      <summary>How to play</summary>
      <ol>
        <li><b>Deal.</b> Pass the phone around. Each player taps their name and secretly reads their word.</li>
        <li><b>Civilians</b> all share the same word. The <b>Undercover</b> gets a similar but different word and doesn't know they're undercover. <b>Mr. White</b> gets no word at all.</li>
        <li><b>Clues.</b> Going around in the order shown, everyone says one word or short phrase about their word. Too vague and you look suspicious; too obvious and you help the infiltrators.</li>
        <li><b>Vote.</b> Everyone points at who they suspect at the same time. The player with the most votes is out and their role is revealed. On a tie, the tied players give one more clue and you vote again.</li>
        <li><b>Mr. White's last chance.</b> If Mr. White is voted out, they get one guess at the civilians' word. Guess right and they win outright.</li>
        <li><b>Winning.</b> Civilians win when every Undercover and Mr. White is out. The infiltrators win if they survive until only one civilian is left.</li>
      </ol>
      <ul><li>Points: civilians 2 each on a win, Mr. White 6, each surviving Undercover 10.</li></ul>
    </details>`;
  },
  v_reveal() {
    const g = S.uc.game;
    return `${gameHeader("UNDERCOVER", "Dealing the words")}
    ${revealGrid(g, "Each player taps their own name, reads their word in private, then hides it before passing on.")}
    <button class="btn btn-main" data-act="ucToClues" ${g.roles.some(r => !r.seen) ? "disabled" : ""}>Everyone's ready</button>
    ${quitLink()}`;
  },
  v_clues() {
    const g = S.uc.game, out = g.roles.filter(r => !r.alive);
    return `${gameHeader("UNDERCOVER", `Round ${g.round}`)}
    <section class="section">
      <p class="eyebrow">Round ${g.round} &middot; Clues</p>
      <h2 class="title">Give your clues</h2>
      <p class="hint">One word or short phrase each, in this order. No repeating a clue someone already said.</p>
    </section>
    <ol class="order">
      ${g.order.map((i, k) => `<li class="${k === 0 ? "first" : ""}">${esc(g.roles[i].name)}${k === 0 ? `<span class="pill">Starts</span>` : ""}</li>`).join("")}
    </ol>
    ${out.length ? `<section class="section"><span class="eyebrow">Out of the game</span>
      <div class="out-list">${out.map(r => `<span class="out-chip"><s>${esc(r.name)}</s><span class="pill ${UC_ROLE[r.role].pill}">${UC_ROLE[r.role].name}</span></span>`).join("")}</div></section>` : ""}
    <button class="btn btn-main" data-act="ucToVote">Time to vote</button>
    ${forgotChips(g.order, "Forgot your word?")}
    ${quitLink()}`;
  },
  v_vote() {
    const g = S.uc.game, sel = ui.sel;
    return `${gameHeader("UNDERCOVER", `Round ${g.round}`)}
    <section class="section">
      <p class="eyebrow">Round ${g.round} &middot; Vote</p>
      <h2 class="title">Who's out?</h2>
      <p class="hint">On three, everyone points at their suspect. Tap whoever got the most votes. On a tie, the tied players give one more clue and you vote again.</p>
    </section>
    <div class="vote" role="group" aria-label="Players still in">
      ${g.order.map(i => `<button data-act="pick" data-i="${i}" data-mark="Out?" aria-pressed="${sel === i}">${esc(g.roles[i].name)}</button>`).join("")}
    </div>
    <button class="btn btn-danger" data-act="ucEliminate" ${sel == null ? "disabled" : ""}>${sel == null ? "Pick a player" : `Vote out ${esc(g.roles[sel].name)}`}</button>
    <button class="btn btn-ghost" data-act="ucBack">Back to clues</button>`;
  },
  v_out() {
    const g = S.uc.game, r = g.roles[g.lastOut], isMW = r.role === "mw";
    let body, actions;
    if (isMW && ui.guess !== "wrong") {
      body = `<p class="note">Mr. White, you get one guess at the civilians' word. Get it right and you win.</p>
        <input type="text" id="mw-guess" data-guess value="${esc(ui.guessText)}" placeholder="Your guess" autocomplete="off" aria-label="Mr. White's guess" style="background:#fffaf0;color:var(--paper-ink);border-color:#cbbf9f">`;
      actions = `<button class="btn btn-main" data-act="ucGuess">Lock in guess</button>`;
    } else if (isMW) {
      body = `<p class="note"><b>Wrong guess.</b> Civilians, if that was just a typo or a close spelling of your word, you can count it.</p>`;
      actions = `<div class="btn-row"><button class="btn btn-ghost" data-act="ucGuessOk">Count it</button><button class="btn btn-main" data-act="ucContinue">Keep playing</button></div>`;
    } else {
      body = `<p class="note">${r.role === "civ" ? "Ouch. An innocent civilian is gone." : "Nice work. One infiltrator down."}</p>`;
      actions = `<button class="btn btn-main" data-act="ucContinue">Continue</button>`;
    }
    return `${gameHeader("UNDERCOVER", `Round ${g.round}`)}
    <div class="dossier flip" style="margin-top:12px">
      <span class="eyebrow">Voted out</span>
      <span class="who">${esc(r.name)}</span>
      <span class="note">was ${isMW ? "" : r.role === "uc" ? "an" : "a"}</span>
      <span class="stamp ${UC_ROLE[r.role].pill}">${UC_ROLE[r.role].name.toUpperCase()}</span>
      ${body}
    </div>
    ${actions}`;
  },
  v_over() {
    const g = S.uc.game, c = this.counts();
    let banner;
    if (g.winner === "civ") banner = "Civilians win";
    else if (g.winner === "mw") banner = "Mr. White wins";
    else if (c.uc && c.mw) banner = "Infiltrators win";
    else if (c.uc) banner = c.uc > 1 ? "Undercovers win" : "Undercover wins";
    else banner = "Mr. White wins";
    return `${gameHeader("UNDERCOVER", `Game over after ${g.round} round${g.round > 1 ? "s" : ""}`)}
    <div class="banner">${banner}</div>
    <div class="words">
      <div><span class="eyebrow">Civilian word</span><b class="c-civ">${esc(g.words.civ)}</b></div>
      <div><span class="eyebrow">Undercover word</span><b class="c-uc">${esc(g.words.uc)}</b></div>
    </div>
    <section class="section"><span class="eyebrow">Who was who</span>
      <ol class="order">${g.roles.map(r => `<li>${r.alive ? esc(r.name) : `<s>${esc(r.name)}</s>`}<span class="pill ${UC_ROLE[r.role].pill}">${UC_ROLE[r.role].name}</span></li>`).join("")}</ol>
    </section>
    <section class="section"><span class="eyebrow">Undercover scores</span>${scoreTable("uc", g.awards)}</section>
    <div class="btn-row">
      <button class="btn btn-ghost" data-act="hub">Game Night</button>
      <button class="btn btn-main" data-act="ucAgain">Play again</button>
    </div>`;
  },

  act(a, d) {
    const C = S.uc, g = C.game;
    switch (a) {
      case "ucAuto": this.resetCounts(); break;
      case "ucStep": C[d.k] += +d.d; break;
      case "ucPack": C.pack = d.pack; ui.err = ""; break;
      case "ucStart": this.start(); return "done";
      case "ucToClues": g.order = this.makeOrder(); g.phase = "clues"; top(); break;
      case "ucToVote": g.phase = "vote"; ui.sel = null; top(); break;
      case "ucBack": g.phase = "clues"; top(); break;
      case "ucEliminate":
        g.roles[ui.sel].alive = false; g.lastOut = ui.sel; g.phase = "out";
        ui.sel = null; ui.guess = null; ui.guessText = ""; top();
        break;
      case "ucGuess":
        if (!ui.guessText.trim()) return;
        if (norm(ui.guessText) === norm(g.words.civ)) this.finish("mw"); else ui.guess = "wrong";
        top(); break;
      case "ucGuessOk": this.finish("mw"); top(); break;
      case "ucContinue": this.nextRound(); return "done";
      case "ucAgain": C.game = null; this.start(); return "done";
      default: return false;
    }
  }
};

// =====================================================================
// Spyfall
// =====================================================================

const SF = {
  maxSpies(n) { return n >= 7 ? 2 : 1; },
  loc(g) { const [name, ...jobs] = SF_PACKS[g.pack].locs[g.loc].split("|"); return { name, jobs }; },
  locNames(pack) { return SF_PACKS[pack].locs.map(l => l.split("|")[0]); },
  left(g) { return g.running ? Math.max(0, g.endAt - Date.now()) : g.remaining; },
  fmt(ms) { const s = Math.ceil(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; },
  pause(g) { if (g.running) { g.remaining = this.left(g); g.running = false; } },
  resume(g) { if (!g.running && g.remaining > 0) { g.endAt = Date.now() + g.remaining; g.running = true; } },
  secret(g, r) {
    if (r.spy) return `<span class="stamp spy" style="margin:10px 0">SPY</span>
      <p class="note">You don't know the location. Listen closely, bluff your answers, and work out where everyone is before they work out who you are.</p>`;
    const L = this.loc(g);
    return `<span class="note">The location is</span>
      <span class="word">${esc(L.name)}</span>
      <span class="note">You are the</span>
      <span class="job">${esc(r.job)}</span>
      <p class="note">One player is a spy who doesn't know where you are. Don't make it easy for them.</p>`;
  },

  start() {
    const C = S.sf;
    const pe = playerError(); if (pe) return fail(pe);
    const n = S.players.length;
    if (n > 12) return fail("Spyfall works best with up to 12 players. Remove a few names on the Game Night screen.");
    C.spies = Math.min(C.spies, this.maxSpies(n));
    const locs = SF_PACKS[C.pack].locs;
    const idx = pickFresh(C.used, C.pack, locs.length);
    const jobs = locs[idx].split("|").slice(1);
    const spySeats = shuffle(S.players.map((_, i) => i)).slice(0, C.spies);
    let pool = [];
    const roles = S.players.map((name, i) => {
      if (spySeats.includes(i)) return { name, spy: true, job: "", seen: false };
      if (!pool.length) pool = shuffle(jobs.slice());
      return { name, spy: false, job: pool.pop(), seen: false };
    });
    C.game = {
      pack: C.pack, loc: idx, roles, phase: "reveal", first: rand(n),
      remaining: C.minutes * 60000, endAt: 0, running: false, timeUp: false,
      outcome: null, guesser: null, guessLoc: null, convicted: null, awards: {}
    };
    resetUi(); keepAwake(); save(); render(); top();
  },
  finish(outcome) {
    const g = S.sf.game;
    this.pause(g);
    g.outcome = outcome; g.phase = "over"; g.awards = {};
    g.roles.forEach((r, i) => {
      let pts = 0;
      if ((outcome === "caught" || outcome === "missed") && !r.spy) pts = 1;
      if (outcome === "escaped" && r.spy) pts = 2;
      if (outcome === "framed" && r.spy) pts = 4;
      if (outcome === "guessed" && i === g.guesser) pts = 4;
      if (pts) { g.awards[r.name] = pts; addScore("sf", r.name, pts); }
    });
    save(); render(); top();
  },
  timeUp() {
    const g = S.sf.game;
    g.running = false; g.remaining = 0; g.timeUp = true; g.phase = "accuse";
    ui.sel = null; alarm(); save(); render(); top();
  },

  view() {
    const g = S.sf.game;
    if (!g) return this.vSetup();
    return this["v_" + g.phase]();
  },
  vSetup() {
    const C = S.sf, n = S.players.length, max = this.maxSpies(n);
    if (C.spies > max) C.spies = max;
    return `
    ${gameHeader("SPYFALL", "One of you doesn't belong here.")}
    ${rosterPanel()}
    <section class="section">
      <h2 class="title">Round</h2>
      <div class="roles two-up">
        <div class="role"><span class="n c-uc">${C.spies}</span><span class="lbl">${C.spies > 1 ? "Spies" : "Spy"}</span>
          <div class="step"><button data-act="sfStep" data-k="spies" data-d="-1" aria-label="Fewer spies" ${C.spies <= 1 ? "disabled" : ""}>&minus;</button><button data-act="sfStep" data-k="spies" data-d="1" aria-label="More spies" ${C.spies >= max ? "disabled" : ""}>+</button></div></div>
        <div class="role"><span class="n c-lamp">${C.minutes}</span><span class="lbl">Minutes</span>
          <div class="step"><button data-act="sfStep" data-k="minutes" data-d="-1" aria-label="Shorter round" ${C.minutes <= 3 ? "disabled" : ""}>&minus;</button><button data-act="sfStep" data-k="minutes" data-d="1" aria-label="Longer round" ${C.minutes >= 15 ? "disabled" : ""}>+</button></div></div>
      </div>
      <p class="hint">${n < 7 ? "A second spy unlocks at 7 players. " : "Two spies don't know about each other. "}8 minutes is the classic round length.</p>
    </section>
    <section class="section">
      <h2 class="title">Locations</h2>
      <div class="seg two-up" role="group" aria-label="Location pack">
        <button data-act="sfPack" data-pack="en" aria-pressed="${C.pack === "en"}">English</button>
        <button data-act="sfPack" data-pack="id" aria-pressed="${C.pack === "id"}">Indonesia</button>
      </div>
      <details>
        <summary>See all ${SF_PACKS[C.pack].locs.length} locations</summary>
        <div class="locs">${this.locNames(C.pack).map(l => `<span>${esc(l)}</span>`).join("")}</div>
      </details>
    </section>
    ${ui.err ? `<p class="err" role="alert">${esc(ui.err)}</p>` : ""}
    <button class="btn btn-main" data-act="sfStart">Deal the cards</button>
    <details>
      <summary>How to play</summary>
      <ol>
        <li><b>Deal.</b> Everyone secretly sees the same location and their own role there. The <b>Spy</b> only sees that they're the spy.</li>
        <li><b>Ask.</b> Start the clock. The first player asks anyone a question about the location ("Would you bring your kids here?"). That person answers, then asks someone else, but not the person who just asked them.</li>
        <li><b>Bluff.</b> Answer so the others know you've seen the location, without being so obvious that the spy figures it out.</li>
        <li><b>Accuse.</b> Anyone can call a vote at any time, once per round. The clock stops. Everyone except the accused must agree. If it's unanimous, the accused shows their card.</li>
        <li><b>Spy's move.</b> The spy can stop the game whenever they like and guess the location. Right and they win; wrong and they lose.</li>
        <li><b>Time's up.</b> When the clock hits zero, you get one last vote. If nobody is convicted, the spy wins.</li>
      </ol>
      <ul><li>Points: spy 2 for surviving, 4 for getting an innocent convicted, 4 for guessing the location. Everyone else 1 each when the spy loses.</li></ul>
    </details>`;
  },
  v_reveal() {
    const g = S.sf.game;
    return `${gameHeader("SPYFALL", "Dealing the cards")}
    ${revealGrid(g, "Each player taps their own name, checks the location and their role in private, then hides it.")}
    <button class="btn btn-main" data-act="sfToPlay" ${g.roles.some(r => !r.seen) ? "disabled" : ""}>Start the clock</button>
    ${quitLink()}`;
  },
  v_play() {
    const g = S.sf.game, ms = this.left(g);
    return `${gameHeader("SPYFALL", g.running ? "Clock running" : "Clock paused")}
    <div class="clock">
      <div class="timer ${ms < 60000 ? "low" : ""} ${g.running ? "" : "paused"}" id="timer" role="timer">${this.fmt(ms)}</div>
      <button class="link" data-act="sfPause">${g.running ? "Pause" : "Resume"}</button>
    </div>
    <p style="text-align:center"><b>${esc(g.roles[g.first].name)}</b> asks the first question.</p>
    <div class="btn-row">
      <button class="btn btn-danger" data-act="sfAccuse">Call a vote</button>
      <button class="btn btn-ghost" data-act="sfSpyGuess">Spy: guess</button>
    </div>
    <section class="section">
      <span class="eyebrow">Possible locations</span>
      <div class="locs">${this.locNames(g.pack).map(l => `<span>${esc(l)}</span>`).join("")}</div>
    </section>
    ${forgotChips(g.roles.map((_, i) => i), "Forgot your card?")}
    ${quitLink()}`;
  },
  v_accuse() {
    const g = S.sf.game, sel = ui.sel;
    return `${gameHeader("SPYFALL", g.timeUp ? "Time's up" : "Clock stopped")}
    <section class="section">
      <p class="eyebrow">${g.timeUp ? "Final vote" : "Accusation"}</p>
      <h2 class="title">${g.timeUp ? "Time's up. Who's the spy?" : "Who are you accusing?"}</h2>
      <p class="hint">Everyone except the accused has to agree. If even one person says no, the vote fails.</p>
    </section>
    <div class="vote" role="group" aria-label="Players">
      ${g.roles.map((r, i) => `<button data-act="pick" data-i="${i}" data-mark="Spy?" aria-pressed="${sel === i}">${esc(r.name)}</button>`).join("")}
    </div>
    <button class="btn btn-danger" data-act="sfConvict" ${sel == null ? "disabled" : ""}>${sel == null ? "Pick a player" : `Everyone agrees: ${esc(g.roles[sel].name)}`}</button>
    ${g.timeUp
      ? `<button class="btn btn-ghost" data-act="sfNoConvict">Nobody agreed. Spy escapes</button>`
      : `<button class="btn btn-ghost" data-act="sfResume">Vote failed, back to questions</button>`}`;
  },
  v_spyguess() {
    const g = S.sf.game, multi = S.sf.game.roles.filter(r => r.spy).length > 1;
    const needWho = multi && ui.guesser == null;
    const who = multi ? ui.guesser : g.roles.findIndex(r => r.spy);
    return `${gameHeader("SPYFALL", "Clock stopped")}
    <section class="section">
      <p class="eyebrow">The spy makes a move</p>
      <h2 class="title">${needWho ? "Which spy is guessing?" : "Where are we?"}</h2>
      <p class="hint">${needWho ? "Tap your own name. Everyone will know you're a spy now." : "One guess. Right and the spy wins; wrong and everyone else does."}</p>
    </section>
    ${needWho
      ? `<div class="vote">${g.roles.map((r, i) => `<button data-act="sfWho" data-i="${i}">${esc(r.name)}</button>`).join("")}</div>
         ${ui.err ? `<p class="err" role="alert">${esc(ui.err)}</p>` : ""}`
      : `<div class="locs">${this.locNames(g.pack).map((l, i) => `<button data-act="sfLoc" data-i="${i}" aria-pressed="${ui.loc === i}">${esc(l)}</button>`).join("")}</div>
         <button class="btn btn-main" data-act="sfLockGuess" data-who="${who}" ${ui.loc == null ? "disabled" : ""}>${ui.loc == null ? "Pick a location" : `Lock in: ${esc(this.locNames(g.pack)[ui.loc])}`}</button>`}
    <button class="btn btn-ghost" data-act="sfResume">Never mind, back to questions</button>`;
  },
  v_over() {
    const g = S.sf.game, L = this.loc(g);
    const spies = g.roles.filter(r => r.spy), plural = spies.length > 1;
    const S_ = plural ? "Spies" : "Spy";
    const guesser = esc(g.roles[g.guesser]?.name || ""), convicted = esc(g.roles[g.convicted]?.name || "");
    const lines = {
      caught: [`${S_} caught`, `${convicted} was ${plural ? "a" : "the"} spy. Everyone else wins.`],
      missed: ["Wrong guess", `${guesser} guessed ${esc(this.locNames(g.pack)[g.guessLoc] || "")}. Everyone else wins.`],
      framed: [`${S_} win${plural ? "" : "s"}`, `${convicted} was innocent.`],
      escaped: [`${S_} win${plural ? "" : "s"}`, "Time ran out and nobody was convicted."],
      guessed: ["Spy wins", `${guesser} worked out the location.`]
    }[g.outcome];
    return `${gameHeader("SPYFALL", "Round over")}
    <div class="banner">${lines[0]}</div>
    <p class="hint center" style="text-align:center">${lines[1]}</p>
    <div class="words one"><div><span class="eyebrow">The location was</span><b class="c-lamp">${esc(L.name)}</b></div></div>
    <section class="section"><span class="eyebrow">Who was who</span>
      <ol class="order">${g.roles.map(r => `<li>${esc(r.name)}${r.spy ? `<span class="pill spy">Spy</span>` : `<span class="job">${esc(r.job)}</span>`}</li>`).join("")}</ol>
    </section>
    <section class="section"><span class="eyebrow">Spyfall scores</span>${scoreTable("sf", g.awards)}</section>
    <div class="btn-row">
      <button class="btn btn-ghost" data-act="hub">Game Night</button>
      <button class="btn btn-main" data-act="sfAgain">Play again</button>
    </div>`;
  },

  act(a, d) {
    const C = S.sf, g = C.game;
    switch (a) {
      case "sfStep": C[d.k] += +d.d; break;
      case "sfPack": C.pack = d.pack; break;
      case "sfStart": primeAudio(); this.start(); return "done";
      case "sfToPlay": primeAudio(); g.phase = "play"; this.resume(g); top(); break;
      case "sfPause": primeAudio(); g.running ? this.pause(g) : this.resume(g); break;
      case "sfAccuse": this.pause(g); g.phase = "accuse"; ui.sel = null; top(); break;
      case "sfSpyGuess": this.pause(g); g.phase = "spyguess"; ui.guesser = null; ui.loc = null; ui.err = ""; top(); break;
      case "sfResume": primeAudio(); g.phase = "play"; ui.sel = null; this.resume(g); top(); break;
      case "sfConvict":
        g.convicted = ui.sel;
        this.finish(g.roles[ui.sel].spy ? "caught" : "framed"); return "done";
      case "sfNoConvict": this.finish("escaped"); return "done";
      case "sfWho":
        if (!g.roles[+d.i].spy) { ui.err = `${g.roles[+d.i].name} isn't a spy. Only a spy can guess.`; break; }
        ui.guesser = +d.i; ui.err = ""; break;
      case "sfLoc": ui.loc = +d.i; break;
      case "sfLockGuess":
        g.guesser = +d.who; g.guessLoc = ui.loc;
        this.finish(ui.loc === g.loc ? "guessed" : "missed"); return "done";
      case "sfAgain": C.game = null; this.start(); return "done";
      default: return false;
    }
  }
};

// ---- narrator voice (the phone's built-in text-to-speech; works offline) ----
const Voice = {
  ok() { return "speechSynthesis" in window && S.ww.voice !== "off" && !S.ww.muted; },
  lines() { return WW_LINES[S.ww.voice === "id" ? "id" : "en"]; },
  pick(lang) {
    try {
      const vs = speechSynthesis.getVoices();
      const base = lang.slice(0, 2);
      return vs.find(v => v.lang === lang && v.localService) || vs.find(v => v.lang === lang)
        || vs.find(v => v.lang.replace("_", "-").startsWith(base)) || null;
    } catch (e) { return null; }
  },
  hasLang(code) { return !!this.pick(WW_LINES[code].lang); },
  // iOS only lets a page speak if the first utterance starts inside a tap.
  unlock() { try { if ("speechSynthesis" in window) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } } catch (e) {} },
  hush() { try { "speechSynthesis" in window && speechSynthesis.cancel(); } catch (e) {} },
  // Speaks a line and resolves when it ends. Falls back to a reading-time pause when muted or unsupported.
  say(text) {
    ui.line = text;
    const el = document.getElementById("ww-line");
    if (el) el.textContent = text;
    const readTime = 900 + text.length * 45;
    return new Promise(res => {
      if (!this.ok()) return setTimeout(res, readTime);
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        this.cur = u; // keep a reference: Chrome drops the callbacks of garbage-collected utterances
        u.lang = this.lines().lang;
        const v = this.pick(u.lang); if (v) u.voice = v;
        u.rate = .92; u.pitch = .8;
        let done = false, started = false;
        const fin = () => { if (!done) { done = true; clearTimeout(t); clearInterval(poll); res(); } };
        const t = setTimeout(fin, 2000 + text.length * 90);
        // Some phones never fire onend, so also watch the speaking flag.
        const poll = setInterval(() => {
          if (speechSynthesis.speaking) started = true;
          else if (started) fin();
        }, 200);
        u.onend = fin; u.onerror = fin;
        speechSynthesis.speak(u);
      } catch (e) { setTimeout(res, readTime); }
    });
  }
};
if ("speechSynthesis" in window) { try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { if (S.screen === "ww" && !S.ww.game) render(); }; } catch (e) {} }

// ---- sound effects, synthesized with Web Audio (no audio files) ----
const Sfx = {
  ok() { return S.ww.sfx && !S.ww.muted && actx; },
  bus: null, amb: null, crk: null, tmo: null,
  // Crickets and heartbeat run through this channel so stopAll can silence them instantly, queued tones included.
  ambBus() {
    if (!this.amb) { this.amb = actx.createGain(); this.amb.connect(actx.destination); }
    return this.amb;
  },
  out() {
    if (!this.bus) {
      // Light echo so the howl sounds like it's coming from the woods.
      const g = actx.createGain(), d = actx.createDelay(), fb = actx.createGain(), lp = actx.createBiquadFilter();
      g.gain.value = .9; d.delayTime.value = .32; fb.gain.value = .32; lp.frequency.value = 1400;
      g.connect(actx.destination); g.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(actx.destination);
      this.bus = g;
    }
    return this.bus;
  },
  howl() {
    if (!this.ok()) return;
    const t = actx.currentTime + .05, out = this.out();
    const voice = (mult, amp, type, delay) => {
      const s = t + delay;
      const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
      const lfo = actx.createOscillator(), lg = actx.createGain();
      o.type = type; f.type = "lowpass"; f.frequency.value = 1600;
      o.frequency.setValueAtTime(240 * mult, s);
      o.frequency.exponentialRampToValueAtTime(540 * mult, s + .7);
      o.frequency.setValueAtTime(540 * mult, s + 2);
      o.frequency.exponentialRampToValueAtTime(360 * mult, s + 3.3);
      lfo.frequency.value = 5; lg.gain.value = 7 * mult; lfo.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(.0001, s);
      g.gain.exponentialRampToValueAtTime(amp, s + .5);
      g.gain.setValueAtTime(amp, s + 2.3);
      g.gain.exponentialRampToValueAtTime(.0001, s + 3.4);
      o.connect(f); f.connect(g); g.connect(out);
      o.start(s); lfo.start(s); o.stop(s + 3.5); lfo.stop(s + 3.5);
    };
    voice(1, .22, "triangle", 0); voice(2, .03, "sine", 0); voice(1.12, .08, "triangle", .5);
  },
  chime() {
    if (!this.ok()) return;
    const t = actx.currentTime + .05;
    [523.25, 659.25, 783.99, 1046.5].forEach((fq, k) => {
      [1, 2.76].forEach((p, j) => {
        const o = actx.createOscillator(), g = actx.createGain(), s = t + k * .22;
        o.frequency.value = fq * p;
        g.gain.setValueAtTime(.0001, s);
        g.gain.exponentialRampToValueAtTime(j ? .03 : .16, s + .01);
        g.gain.exponentialRampToValueAtTime(.0001, s + 1.8);
        o.connect(g); g.connect(this.out()); o.start(s); o.stop(s + 1.9);
      });
    });
  },
  thud() {
    if (!this.ok()) return;
    const t = actx.currentTime + .02;
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(38, t + .6);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.7, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + 1.1);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 1.2);
    const n = actx.createBufferSource(), buf = actx.createBuffer(1, actx.sampleRate * .4, actx.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
    const nf = actx.createBiquadFilter(), ng = actx.createGain();
    nf.type = "lowpass"; nf.frequency.value = 500; ng.gain.value = .35;
    n.buffer = buf; n.connect(nf); nf.connect(ng); ng.connect(actx.destination); n.start(t);
  },
  chirp() {
    if (!this.ok()) return;
    const t = actx.currentTime, fq = 4200 + Math.random() * 400;
    for (let k = 0; k < 3; k++) {
      const s = t + k * .085, o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = fq;
      g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(.035, s + .01); g.gain.exponentialRampToValueAtTime(.0001, s + .055);
      o.connect(g); g.connect(this.ambBus()); o.start(s); o.stop(s + .06);
    }
  },
  crickets(on) {
    clearInterval(this.crk); clearTimeout(this.tmo); this.crk = this.tmo = null;
    if (on) this.crk = setInterval(() => { this.chirp(); if (Math.random() < .5) this.tmo = setTimeout(() => this.chirp(), 330); }, 1150);
  },
  beats(n) {
    if (!this.ok()) return;
    const t0 = actx.currentTime + .05;
    for (let b = 0; b < n; b++) this.beat(t0 + b * .9);
  },
  beat(t) {
    [0, .24].forEach((d, k) => {
      const o = actx.createOscillator(), g = actx.createGain(), s = t + d;
      o.frequency.setValueAtTime(k ? 58 : 66, s); o.frequency.exponentialRampToValueAtTime(40, s + .15);
      g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(k ? .35 : .5, s + .015); g.gain.exponentialRampToValueAtTime(.0001, s + .22);
      o.connect(g); g.connect(this.ambBus()); o.start(s); o.stop(s + .25);
    });
  },
  stopAll() {
    this.crickets(false);
    if (this.amb) {
      try { this.amb.gain.setValueAtTime(0, actx.currentTime); this.amb.disconnect(); } catch (e) {}
      this.amb = null;
    }
  }
};

const wait = ms => new Promise(r => setTimeout(r, ms));
// Night privacy: the phone only makes sound while it sits in the middle of the table.
// Once a role is called, it stays silent until they've put it back.
const WW_RETURN_MS = 6000;
let wwSeq = 0; // bumps whenever a narrated sequence should stop (quit, skip ahead, leave the game)

const WW = {
  defaults(n) { return n <= 5 ? 1 : n <= 8 ? 2 : n <= 12 ? 3 : 4; },
  specials(C) { return (C.seer ? 1 : 0) + (C.doc ? 1 : 0) + (C.hunter ? 1 : 0); },
  autoWolves() { const n = S.players.length; S.ww.wolves = Math.max(1, Math.min(this.defaults(n), Math.floor((n - 1) / 2))); },
  valid(n, C) { return n >= 5 && C.wolves >= 1 && C.wolves * 2 < n && C.wolves + this.specials(C) <= n; },
  L() { return Voice.lines(); },
  alive(g, role) { return g.roles.some(r => r.alive && r.role === role); },
  inGame(g, role) { return g.roles.some(r => r.role === role); },
  aliveIdx(g) { return g.roles.map((r, i) => i).filter(i => g.roles[i].alive); },
  secret(g, r) {
    const R = WW_ROLE[r.role];
    const pack = r.role === "wolf" ? g.roles.filter(x => x.role === "wolf" && x !== r).map(x => x.name) : [];
    return `<span class="note">You are ${r.role === "wolf" ? "a" : r.role === "vill" ? "a" : "the"}</span>
      <span class="stamp ${r.role === "wolf" ? "spy" : "civ"}" style="margin:8px 0">${R.name.toUpperCase()}</span>
      <p class="note">${R.desc}</p>
      ${r.role === "wolf" ? `<p class="note"><b>${pack.length ? `Your pack: ${pack.map(esc).join(", ")}` : "You hunt alone."}</b></p>` : ""}`;
  },
  stop() { wwSeq++; Voice.hush(); Sfx.stopAll(); },

  start() {
    const C = S.ww;
    const pe = playerError(); if (pe) return fail(pe);
    const n = S.players.length;
    if (n < 5) return fail("Werewolf needs at least 5 players. Add more on the Game Night screen.");
    if (C.wolves == null || !this.valid(n, C)) this.autoWolves();
    if (!this.valid(n, C)) return fail("Too many special roles for this many players. Switch one off.");
    const deck = shuffle([
      ...Array(C.wolves).fill("wolf"),
      ...(C.seer ? ["seer"] : []), ...(C.doc ? ["doc"] : []), ...(C.hunter ? ["hunter"] : []),
      ...Array(n - C.wolves - this.specials(C)).fill("vill")
    ]);
    C.game = {
      roles: S.players.map((name, i) => ({ name, role: deck[i], alive: true, seen: false })),
      phase: "reveal", night: 1, steps: [], si: 0,
      victim: null, saved: null, lastSaved: null, seerSaw: null,
      report: [], shot: null, hunterUsed: false, hunter: null, back: null, votedOut: undefined,
      remaining: 0, endAt: 0, running: false, timeUp: false, winner: null, awards: {}
    };
    resetUi(); keepAwake(); save(); render(); top();
  },

  // ---- night ----
  async startNight() {
    const g = S.ww.game, id = ++wwSeq;
    primeAudio(); Voice.unlock();
    if (!this.alive(g, "doc")) g.lastSaved = null;
    g.phase = "night"; g.si = -1; g.victim = null; g.saved = null; g.seerSaw = null; g.shot = null;
    g.steps = ["wolves", ...(this.inGame(g, "seer") ? ["seer"] : []), ...(this.inGame(g, "doc") ? ["doc"] : [])];
    ui.busy = true; ui.sel = null; save(); render(); top();
    Sfx.howl(); Sfx.crickets(true);
    await wait(1200); if (id !== wwSeq) return;
    await Voice.say(this.L().night(g.night)); if (id !== wwSeq) return;
    await wait(1500); if (id !== wwSeq) return;
    this.nextStep(id);
  },
  async nextStep(id) {
    const g = S.ww.game;
    g.si++; ui.sel = null; ui.seerResult = null;
    if (g.si >= g.steps.length) return this.dawn(id);
    const step = g.steps[g.si];
    ui.busy = true; save(); render();
    // Ambience ends before a role is called; from here until the phone is back in the middle, nothing plays.
    Sfx.stopAll();
    if (step === "wolves" && Sfx.ok()) { Sfx.beats(3); await wait(2700); if (id !== wwSeq) return; Sfx.stopAll(); }
    await Voice.say(this.L().open[step]); if (id !== wwSeq) return;
    Sfx.stopAll();
    ui.busy = false; render();
    const who = { wolves: "wolf", seer: "seer", doc: "doc" }[step];
    if (!this.alive(g, who)) {
      // The role is dead, but the narrator still calls it and waits about as long as a real turn.
      await wait(5000 + rand(8000)); if (id !== wwSeq) return;
      this.endStep(id);
    }
  },
  async endStep(id) {
    const g = S.ww.game, step = g.steps[g.si];
    Sfx.stopAll();
    ui.busy = true; ui.returning = true; ui.seerResult = null; render();
    const until = Date.now() + WW_RETURN_MS;
    const count = setInterval(() => {
      const el = document.getElementById("ww-count");
      if (el) el.textContent = Math.max(0, Math.ceil((until - Date.now()) / 1000));
    }, 250);
    await wait(WW_RETURN_MS);
    clearInterval(count);
    if (id !== wwSeq) return;
    ui.returning = false; render();
    Sfx.crickets(true);
    await Voice.say(this.L().close[step]); if (id !== wwSeq) return;
    await wait(1400); if (id !== wwSeq) return;
    this.nextStep(id);
  },

  // ---- morning ----
  kill(i) { S.ww.game.roles[i].alive = false; },
  async dawn(id) {
    const g = S.ww.game, L = this.L();
    Sfx.stopAll();
    const died = g.victim != null && g.victim !== g.saved ? g.victim : null;
    if (died != null) this.kill(died);
    g.report = died != null ? [died] : [];
    g.phase = "dawn"; ui.busy = true; save(); render(); top();
    Sfx.chime();
    await wait(600); if (id !== wwSeq) return;
    await Voice.say(L.wake); if (id !== wwSeq) return;
    if (died != null) {
      Sfx.thud();
      await Voice.say(L.killed(g.roles[died].name)); if (id !== wwSeq) return;
      if (S.ww.reveal && g.roles[died].role !== "hunter") { await Voice.say(L.was(g.roles[died].name, L.roles[g.roles[died].role])); if (id !== wwSeq) return; }
    } else {
      await Voice.say(L.nobody); if (id !== wwSeq) return;
    }
    this.afterDeaths(died, "dawn", id);
  },
  async afterDeaths(died, back, id) {
    const g = S.ww.game, L = this.L();
    if (died != null && g.roles[died].role === "hunter" && !g.hunterUsed) {
      g.hunterUsed = true; g.hunter = died; g.back = back; g.phase = "hunter";
      ui.sel = null; ui.busy = true; save(); render(); top();
      await Voice.say(L.hunter(g.roles[died].name)); if (id !== wwSeq) return;
      ui.busy = false; render();
      return;
    }
    const win = this.checkWin();
    if (win) {
      this.finish(win);
      await Voice.say(win === "village" ? L.village : L.wolves);
      return;
    }
    g.phase = back; ui.busy = false; save(); render();
  },
  async hunterShoots(t) {
    const g = S.ww.game, L = this.L(), id = ++wwSeq;
    this.kill(t); g.shot = { by: g.hunter, t };
    g.phase = g.back; ui.busy = true; save(); render(); top();
    Sfx.thud();
    await Voice.say(L.shot(g.roles[t].name)); if (id !== wwSeq) return;
    if (S.ww.reveal) { await Voice.say(L.was(g.roles[t].name, L.roles[g.roles[t].role])); if (id !== wwSeq) return; }
    this.afterDeaths(t, g.back, id);
  },
  // Resolves a pending Hunter shot or a finished game before moving on. Returns true if it took over.
  settle() {
    const g = S.ww.game;
    const h = g.roles.findIndex(r => r.role === "hunter" && !r.alive);
    if (h >= 0 && !g.hunterUsed) {
      g.hunterUsed = true; g.hunter = h; g.back = g.phase; g.phase = "hunter"; ui.sel = null; ui.busy = false;
      save(); render(); top(); return true;
    }
    const win = this.checkWin();
    if (win) { this.finish(win); return true; }
    return false;
  },
  checkWin() {
    const g = S.ww.game;
    let wolves = 0, others = 0;
    g.roles.forEach(r => { if (r.alive) r.role === "wolf" ? wolves++ : others++; });
    if (wolves === 0) return "village";
    if (wolves >= others) return "wolves";
    return null;
  },
  finish(win) {
    const g = S.ww.game;
    Sfx.stopAll(); SF.pause(g);
    g.winner = win; g.phase = "over"; g.awards = {};
    g.roles.forEach(r => {
      const pts = win === "wolves" ? (r.role === "wolf" ? 3 : 0) : (r.role === "wolf" ? 0 : 2);
      if (pts) { g.awards[r.name] = pts; addScore("ww", r.name, pts); }
    });
    ui.busy = false; save(); render(); top();
  },

  // ---- day ----
  async toDay() {
    const g = S.ww.game, id = ++wwSeq;
    Voice.hush();
    g.phase = "day"; g.timeUp = false; g.remaining = S.ww.talk * 60000; g.running = false;
    if (S.ww.talk) SF.resume(g);
    save(); render(); top();
    await Voice.say(this.L().talk);
  },
  async timeUp() {
    const g = S.ww.game, id = ++wwSeq;
    g.running = false; g.remaining = 0; g.timeUp = true; g.phase = "vote"; ui.sel = null;
    alarm(); save(); render(); top();
    await wait(1600); if (id !== wwSeq) return;
    Voice.say(this.L().timeUp);
  },
  async vote(i) {
    const g = S.ww.game, L = this.L(), id = ++wwSeq;
    SF.pause(g);
    g.votedOut = i; g.shot = null;
    if (i != null) this.kill(i);
    g.phase = "voted"; ui.busy = true; save(); render(); top();
    if (i != null) {
      Sfx.thud();
      await Voice.say(L.voted(g.roles[i].name)); if (id !== wwSeq) return;
      if (S.ww.reveal && g.roles[i].role !== "hunter") { await Voice.say(L.was(g.roles[i].name, L.roles[g.roles[i].role])); if (id !== wwSeq) return; }
    } else {
      await Voice.say(L.skip); if (id !== wwSeq) return;
    }
    this.afterDeaths(i, "voted", id);
  },

    <section class="section">

  v_voted() {

  v_over() {

    <section class="section"><span class="eyebrow">Who was who</span>
      <ol class="order">${g.roles.map(r => `<li>${r.alive ? esc(r.name) : `<s>${esc(r.name)}</s>`}<span class="pill ${WW_ROLE[r.role].pill}">${WW_ROLE[r.role].name}</span></li>`).join("")}</ol>
    </section>
    <section class="section"><span class="eyebrow">Werewolf scores</span>${scoreTable("ww", g.awards)}</section>
    <div class="btn-row">
      <button class="btn btn-ghost" data-act="hub">Game Night</button>
      <button class="btn btn-main" data-act="wwAgain">Play again</button>
    </div>`;
  },
  shotNote() {
    const g = S.ww.game;
    if (!g.shot) return "";
    const t = g.roles[g.shot.t];
    return `<p class="out-chip" style="align-self:center">The Hunter shot <b style="color:var(--fg)">&nbsp;${esc(t.name)}</b>${S.ww.reveal ? `<span class="pill ${WW_ROLE[t.role].pill}">${WW_ROLE[t.role].name}</span>` : ""}</p>`;
  },
  graveyard() {
    const g = S.ww.game, dead = g.roles.filter(r => !r.alive);
    if (!dead.length) return "";
    return `<section class="section"><span class="eyebrow">Graveyard</span>
      <div class="out-list">${dead.map(r => `<span class="out-chip"><s>${esc(r.name)}</s>${S.ww.reveal ? `<span class="pill ${WW_ROLE[r.role].pill}">${WW_ROLE[r.role].name}</span>` : ""}</span>`).join("")}</div>
    </section>`;
  },

  act(a, d) {
    const C = S.ww, g = C.game;
    switch (a) {
      case "wwStep": C[d.k] += +d.d; break;
      case "wwToggle": C[d.k] = !C[d.k]; break;
      case "wwVoice": C.voice = d.v; break;
      case "wwSfx": C.sfx = d.v === "1"; break;
      case "wwMute":
        C.muted = !C.muted;
        if (C.muted) { Voice.hush(); Sfx.stopAll(); }
        else { primeAudio(); Voice.unlock(); }
        break;
      case "wwTest":
        primeAudio(); Voice.unlock(); C.muted = false;
        Sfx.howl(); setTimeout(() => Voice.say(this.L().test), 1500);
        break;
      case "wwStart": primeAudio(); Voice.unlock(); this.start(); return "done";
      case "wwNightIntro": g.phase = "nightIntro"; top(); break;
      case "wwStartNight": this.startNight(); return "done";
      case "wwChoose": {
        const step = g.steps[g.si], i = ui.sel;
        if (i == null) return "done";
        if (step === "wolves") { g.victim = i; save(); this.endStep(wwSeq); }
        else if (step === "doc") { g.saved = i; g.lastSaved = i; save(); this.endStep(wwSeq); }
        else if (step === "seer") { g.seerSaw = i; ui.seerResult = i; save(); render(); }
        return "done";
      }
      case "wwEndStep":
        if (g.steps[g.si] === "doc" && !this.alive(g, "doc")) g.lastSaved = null;
        this.endStep(++wwSeq); return "done";
      case "wwShoot": if (ui.sel != null) this.hunterShoots(ui.sel); return "done";
      case "wwToDay": this.stop(); Voice.unlock(); if (!this.settle()) this.toDay(); return "done";
      case "wwPause": primeAudio(); g.running ? SF.pause(g) : SF.resume(g); break;
      case "wwToVote": SF.pause(g); Voice.hush(); g.phase = "vote"; ui.sel = null; top(); break;
      case "wwVote": if (ui.sel != null) this.vote(ui.sel); return "done";
      case "wwSkipVote": this.vote(null); return "done";
      case "wwNextNight": this.stop(); if (this.settle()) return "done"; g.night++; g.phase = "nightIntro"; ui.sel = null; top(); break;
      case "wwAgain": this.stop(); C.game = null; this.start(); return "done";
      default: return false;
    }
  }
};

const GAMES = { uc: UC, sf: SF, ww: WW };
const curGame = () => S.screen === "hub" ? null : S[S.screen].game;

// =====================================================================
// Render + events
// =====================================================================

let ticker = null;
function syncTicker() {
  clearInterval(ticker); ticker = null;
  const g = curGame();
  if (!g || !g.running) return;
  let onEnd, low = 60000;
  if (S.screen === "sf" && g.phase === "play") onEnd = () => SF.timeUp();
  else if (S.screen === "ww" && g.phase === "day") { onEnd = () => WW.timeUp(); low = 30000; }
  else return;
  const tick = () => {
    const ms = SF.left(g);
    const el = document.getElementById("timer");
    if (el) { el.textContent = SF.fmt(ms); el.classList.toggle("low", ms < low); }
    if (ms <= 0) { clearInterval(ticker); ticker = null; onEnd(); }
  };
  tick();
  if (ticker === null && g.running) ticker = setInterval(tick, 250);
}

function fail(msg) { ui.err = msg; render(); }

function render() {
  $app.className = "theme-" + S.screen;
  let html = S.screen === "hub" ? Hub.view() : GAMES[S.screen].view();
  if (ui.peek && curGame()) html += viewPeek();
  $app.innerHTML = html;
  syncTicker();
  const g = curGame();
  if (S.screen === "uc" && g && g.phase === "out" && g.roles[g.lastOut].role === "mw" && ui.guess !== "wrong" && !ui.peek) {
    document.getElementById("mw-guess")?.focus({ preventScroll: true });
  }
}

$app.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.player != null) { S.players[+t.dataset.player] = t.value; ui.err = ""; save(); }
  else if (t.dataset.custom) { S.uc.custom[t.dataset.custom] = t.value; save(); }
  else if (t.dataset.guess != null) { ui.guessText = t.value; }
});
$app.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.dataset.guess != null) { e.preventDefault(); act("ucGuess"); }
  else if (e.target.dataset.player != null) {
    e.preventDefault();
    const next = document.getElementById("p-" + (+e.target.dataset.player + 1));
    if (next) next.focus(); else act("add");
  }
});
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  act(b.dataset.act, b.dataset);
});

function act(a, d = {}) {
  if (ui.confirm && a !== ui.confirm) ui.confirm = null;
  const g = curGame();
  switch (a) {
    case "add":
      S.players.push(""); UC.resetCounts(); WW.autoWolves(); ui.err = ""; save(); render();
      document.getElementById("p-" + (S.players.length - 1))?.focus();
      return;
    case "rm": S.players.splice(+d.i, 1); UC.resetCounts(); WW.autoWolves(); ui.err = ""; break;
    case "open": S.screen = d.g; resetUi(); top(); break;
    case "hub": WW.stop(); S.screen = "hub"; resetUi(); top(); break;
    case "reset":
      if (ui.confirm === "reset") { S.scores = { uc: {}, sf: {}, ww: {} }; ui.confirm = null; } else ui.confirm = "reset";
      break;
    case "quit":
      if (ui.confirm === "quit") { WW.stop(); S[S.screen].game = null; resetUi(); top(); } else ui.confirm = "quit";
      break;
    case "peek": ui.peek = { i: +d.i, shown: false }; keepAwake(); break;
    case "show": ui.peek.shown = true; break;
    case "hide": g.roles[ui.peek.i].seen = true; ui.peek = null; break;
    case "closePeek": ui.peek = null; break;
    case "pick": ui.sel = +d.i; break;
    default: {
      // Game actions return "done" when they already saved and rendered, false when unknown.
      const r = GAMES[S.screen] ? GAMES[S.screen].act(a, d) : false;
      if (r === false || r === "done") return;
    }
  }
  save(); render();
}

render();

// Offline support when installed from the web (the standalone build links a manifest).
if ("serviceWorker" in navigator && location.protocol.startsWith("http") && document.querySelector('link[rel="manifest"]')) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
