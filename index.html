    </details>
    <details>
      <summary>All ${Object.keys(WW_ROLE).length} roles</summary>
      <ul class="rguide">${Object.keys(WW_ROLE).map(k => `<li><b>${WW_ROLE[k].name}</b> <span class="pill ${this.pill(k)}">${WW_ROLE[k].team === "wolf" ? "Wolf team" : WW_ROLE[k].team === "neutral" ? "Solo" : "Village"}</span><br>${WW_ROLE[k].desc}</li>`).join("")}</ul>
    </details>`;
  },
  v_reveal() {
    const g = S.ww.game;
    return `${this.header("Dealing the roles")}
    ${revealGrid(g, "Each player taps their own name and checks their role in private. Then put the phone in the middle of the table.")}
    <button class="btn btn-main" data-act="wwNightIntro" ${g.roles.some(r => !r.seen) ? "disabled" : ""}>Everyone's ready</button>
    ${quitLink()}`;
  },
  v_nightIntro() {
    const g = S.ww.game;
    return `${this.header(`Night ${g.night}`)}
    <div class="moon" aria-hidden="true"></div>
    <section class="section center">
      <p class="eyebrow">Night ${g.night}</p>
      <h2 class="title">Phone in the middle</h2>
      <p class="hint">Tap Start, then everyone closes their eyes and listens to the narrator.</p>
    </section>
    <button class="btn btn-main" data-act="wwStartNight">Start night ${g.night}</button>
    ${this.graveyard()}
    ${quitLink()}`;
  },
  pickList(list, max, verb) {
    const g = S.ww.game;
    return `<div class="vote" role="group" aria-label="Choose ${max > 1 ? max + " players" : "a player"}">
      ${list.map(i => `<button data-act="wwPick" data-i="${i}" data-max="${max}" data-mark="${verb}" aria-pressed="${ui.sels.includes(i)}">${esc(g.roles[i].name)}</button>`).join("")}
    </div>`;
  },
  names(idx) { return idx.map(i => esc(S.ww.game.roles[i].name)).join(" &amp; "); },
  nightBody(step) {
    const g = S.ww.game, all = this.aliveIdx(g);
    if (step === "lovers") {
      return `<div class="dossier flip"><span class="eyebrow">Bound by Cupid</span>
        <span class="who">${this.names(g.lovers || [])}</span>
        <p class="note">If one of you dies, so does the other.</p></div>`;
    }
    if (!this.stepActive(g, step)) {
      return `<p class="hint center">&hellip;</p><button class="link" data-act="wwEndStep" style="align-self:center">Continue</button>`;
    }
    if (step === "cupid") {
      return `${this.pickList(all, 2, "Love")}
        <button class="btn btn-main" data-act="wwChoose" ${ui.sels.length === 2 ? "" : "disabled"}>${ui.sels.length === 2 ? `Make ${this.names(ui.sels)} fall in love` : "Choose two players"}</button>`;
    }
    if (step === "wolves") {
      const list = all.filter(i => !this.isWolf(g.roles[i].role)), need = Math.min(g.kills, list.length);
      return `${g.kills > 1 ? `<p class="hint center" style="text-align:center"><b>Two victims tonight.</b></p>` : ""}
        ${this.pickList(list, need, "Kill")}
        <button class="btn btn-danger" data-act="wwChoose" ${ui.sels.length === need ? "" : "disabled"}>${ui.sels.length === need ? `Kill ${this.names(ui.sels)}` : need > 1 ? "Choose two players" : "Choose a player"}</button>`;
    }
    if (step === "witch") return this.witchBody();
    if (step === "seer" || step === "appr") {
      if (step === "appr" && this.alive(g, "seer")) {
        return `<p class="hint center" style="text-align:center">The Seer is still alive. Keep watching and learning.</p>
          <button class="btn btn-main" data-act="wwEndStep">Close my eyes</button>`;
      }
      if (ui.seerResult != null) {
        const r = g.roles[ui.seerResult], bad = this.looksWolf(r.role);
        return `<div class="dossier flip"><span class="who">${esc(r.name)}</span>
            <span class="stamp ${bad ? "spy" : "civ"}">${bad ? "WEREWOLF" : "NOT A WEREWOLF"}</span></div>
          <button class="btn btn-main" data-act="wwEndStep">Done, close my eyes</button>`;
      }
      const list = all.filter(i => g.roles[i].role !== step);
      return `${this.pickList(list, 1, "Check")}
        <button class="btn btn-main" data-act="wwChoose" ${ui.sels.length ? "" : "disabled"}>${ui.sels.length ? `Check ${this.names(ui.sels)}` : "Choose a player"}</button>`;
    }
    if (step === "doc") {
      const list = all.filter(i => i !== g.lastSaved);
      return `${this.pickList(list, 1, "Protect")}
        ${g.lastSaved != null && g.roles[g.lastSaved].alive ? `<p class="hint">${esc(g.roles[g.lastSaved].name)} was protected last night, so not tonight.</p>` : ""}
        <button class="btn btn-main" data-act="wwChoose" ${ui.sels.length ? "" : "disabled"}>${ui.sels.length ? `Protect ${this.names(ui.sels)}` : "Choose a player"}</button>`;
    }
    return "";
  },
  witchBody() {
    const g = S.ww.game, me = g.roles.findIndex(r => r.role === "witch");
    if (ui.wstage === "poison") {
      return `<p class="hint">Who drinks the poison?</p>
        ${this.pickList(this.aliveIdx(g).filter(i => i !== me), 1, "Poison")}
        <div class="btn-row">
          <button class="btn btn-ghost" data-act="wwPoisonBack">Back</button>
          <button class="btn btn-danger" data-act="wwPoisonSet" ${ui.sels.length ? "" : "disabled"}>${ui.sels.length ? `Poison ${this.names(ui.sels)}` : "Choose"}</button>
        </div>`;
    }
    const attacked = g.targets;
    return `<div class="panel"><span class="eyebrow">Attacked tonight</span>
        <b style="font-size:1.2rem">${attacked.length ? this.names(attacked) : "Nobody"}</b></div>
      <section class="section">
        <span class="eyebrow">Healing potion</span>
        ${g.healUsed ? `<p class="hint">Used up.</p>` : attacked.length
          ? `<div class="toggles">${attacked.map(i => `<button class="toggle" data-act="wwHeal" data-i="${i}" aria-pressed="${ui.wheal === i}">Save ${esc(g.roles[i].name)}</button>`).join("")}</div>`
          : `<p class="hint">Nobody to save tonight. Keep it for later.</p>`}
      </section>
      <section class="section">
        <span class="eyebrow">Poison</span>
        ${g.poisonUsed ? `<p class="hint">Used up.</p>` : ui.wpoison != null
          ? `<p>Poisoning <b>${esc(g.roles[ui.wpoison].name)}</b> <button class="link" data-act="wwPoisonClear">Undo</button></p>`
          : `<button class="btn btn-ghost" data-act="wwPoisonMode">Poison someone&hellip;</button>`}
      </section>
      <button class="btn btn-main" data-act="wwWitchDone">${ui.wheal != null || ui.wpoison != null ? "Use potions and close my eyes" : "Do nothing tonight"}</button>`;
  },
  v_night() {
    const g = S.ww.game, step = g.steps[g.si];
    if (ui.returning) {
      return `${this.header(`Night ${g.night}`)}
      <section class="section center" style="padding-top:18vh">
        <p class="ww-line">Put the phone back in the middle</p>
        <p class="hint">Then close your eyes. The narrator stays quiet until then.</p>
        <div class="timer paused" id="ww-count" aria-live="off">${Math.ceil(WW_RETURN_MS / 1000)}</div>
      </section>`;
    }
    const body = !ui.busy && step ? this.nightBody(step) : "";
    const silent = !ui.busy && step && step !== "lovers" && this.stepActive(g, step);
    return `${this.header(`Night ${g.night}`)}
    <div class="moon small" aria-hidden="true"></div>
    <section class="section center">
      <p class="eyebrow">${step ? WW_STEP_TITLE[step] : "Night falls"}</p>
      <p class="ww-line" id="ww-line">${esc(ui.line || "")}</p>
      ${silent ? `<p class="hint">The phone stays silent while you choose.</p>` : ""}
    </section>
    ${body}`;
  },
  deathCards(ds) {
    const g = S.ww.game;
    return `<div class="deaths">${ds.map(d => {
      const r = g.roles[d.i];
      const showRole = S.ww.reveal || r.role === "hunter";
      return `<div class="dossier flip"><span class="eyebrow">${WW_CAUSE[d.cause]}</span>
        <span class="who">${esc(r.name)}</span>
        ${showRole ? `<span class="stamp ${this.stampClass(r.role)}">${WW_ROLE[r.role].name.toUpperCase()}</span>` : ""}</div>`;
    }).join("")}</div>`;
  },
  v_dawn() {
    const g = S.ww.game;
    return `${this.header(`Day ${g.night}`)}
    <div class="sun" aria-hidden="true"></div>
    ${g.report.length ? this.deathCards(g.report)
      : `<div class="banner" style="color:var(--civ)">Nobody died</div><p class="hint center" style="text-align:center">Someone was looking out for the village.</p>`}
    <button class="btn btn-main" data-act="wwToDay" ${ui.busy ? "disabled" : ""}>${ui.busy ? "Listen to the narrator&hellip;" : "Start the discussion"}</button>
    ${this.graveyard()}`;
  },
  v_hunter() {
    const g = S.ww.game, h = g.roles[g.hunter];
    return `${this.header("The Hunter's last shot")}
    <div class="dossier flip">
      <span class="who">${esc(h.name)}</span>
      <span class="stamp civ">HUNTER</span>
      <p class="note">Take one player down with you. Choose fast.</p>
    </div>
    ${this.pickList(this.aliveIdx(g), 1, "Shoot")}
    <button class="btn btn-danger" data-act="wwShoot" ${!ui.sels.length || ui.busy ? "disabled" : ""}>${ui.sels.length ? `Shoot ${this.names(ui.sels)}` : "Choose a player"}</button>`;
  },
  v_day() {
    const g = S.ww.game, ms = SF.left(g);
    return `${this.header(`Day ${g.night}`)}
    ${S.ww.talk ? `<div class="clock">
      <div class="timer ${ms < 30000 ? "low" : ""} ${g.running ? "" : "paused"}" id="timer" role="timer">${SF.fmt(ms)}</div>
      <button class="link" data-act="wwPause">${g.running ? "Pause" : "Resume"}</button>
    </div>` : ""}
    <section class="section">
      <p class="eyebrow">Day ${g.night} &middot; Discussion</p>
      <h2 class="title">Who are the wolves?</h2>
      <p class="hint">Talk it out. When you're ready, everyone points at the same time and you tap whoever got the most votes.</p>
    </section>
    <button class="btn btn-main" data-act="wwToVote">Time to vote</button>
    ${this.graveyard()}
    ${forgotChips(this.aliveIdx(g), "Forgot your role?")}
    ${quitLink()}`;
  },
  v_vote() {
    const g = S.ww.game;
    return `${this.header(`Day ${g.night}`)}
    <section class="section">
      <p class="eyebrow">Day ${g.night} &middot; Vote</p>
      <h2 class="title">${g.timeUp ? "Time's up. Vote!" : "Who's out?"}</h2>
      <p class="hint">On three, everyone points. The Mayor counts twice if they've revealed themselves. Tap whoever got the most votes, or skip if there's a tie nobody will break.</p>
    </section>
    ${this.pickList(this.aliveIdx(g), 1, "Out?")}
    <button class="btn btn-danger" data-act="wwVote" ${ui.sels.length ? "" : "disabled"}>${ui.sels.length ? `Vote out ${this.names(ui.sels)}` : "Pick a player"}</button>
    <button class="btn btn-ghost" data-act="wwSkipVote">No one goes today</button>`;
  },
  v_voted() {
    const g = S.ww.game, i = g.votedOut;
    let body;
    if (i == null) body = `<div class="banner">No one goes</div>`;
    else if (g.princeSaved) body = `<div class="dossier flip"><span class="eyebrow">Voted out, but&hellip;</span>
        <span class="who">${esc(g.roles[i].name)}</span><span class="stamp civ">PRINCE</span>
        <p class="note">Royalty can't be exiled. They stay in the game.</p></div>`;
    else body = this.deathCards(g.report);
    return `${this.header(`Day ${g.night}`)}
    ${body}
    <button class="btn btn-main" data-act="wwNextNight" ${ui.busy ? "disabled" : ""}>${ui.busy ? "Listen to the narrator&hellip;" : `Night ${g.night + 1} falls`}</button>`;
  },
  v_over() {
    const g = S.ww.game;
    const banner = { village: "Village wins", wolves: "Werewolves win", jester: "Jester wins", lovers: "Lovers win" }[g.winner];
    const color = { village: "var(--civ)", wolves: "var(--spy)", jester: "var(--ghost)", lovers: "#ff8fb1" }[g.winner];
    return `${this.header("Game over")}
    <div class="banner" style="color:${color}">${banner}</div>
    ${g.lovers ? `<p class="hint center" style="text-align:center">Lovers: ${this.names(g.lovers)}</p>` : ""}
    <section class="section"><span class="eyebrow">Who was who</span>
      <ol class="order">${g.roles.map(r => `<li>${r.alive ? esc(r.name) : `<s>${esc(r.name)}</s>`}<span class="pill ${this.pill(r.role)}">${WW_ROLE[r.role].name}</span></li>`).join("")}</ol>
    </section>
    <section class="section"><span class="eyebrow">Werewolf scores</span>${scoreTable("ww", g.awards)}</section>
    <div class="btn-row">
      <button class="btn btn-ghost" data-act="hub">Game Night</button>
      <button class="btn btn-main" data-act="wwAgain">Play again</button>
    </div>`;
  },
  graveyard() {
    const g = S.ww.game, dead = g.roles.filter(r => !r.alive);
    if (!dead.length) return "";
    return `<section class="section"><span class="eyebrow">Graveyard</span>
      <div class="out-list">${dead.map(r => `<span class="out-chip"><s>${esc(r.name)}</s>${S.ww.reveal || r.role === "hunter" ? `<span class="pill ${this.pill(r.role)}">${WW_ROLE[r.role].name}</span>` : ""}</span>`).join("")}</div>
    </section>`;
  },

  act(a, d) {
    const C = S.ww, g = C.game;
    switch (a) {
      case "wwStep": C[d.k] += +d.d; break;
      case "wwToggle": C[d.k] = !C[d.k]; break;
      case "wwToggleRole": { const on = this.on(C); on[d.k] = !on[d.k]; break; }
      case "wwPreset": this.preset(d.v); break;
      case "wwVoice": C.voice = d.v; break;
      case "wwSfx": C.sfx = d.v === "1"; break;
      case "wwMute":
        C.muted = !C.muted;
        if (C.muted) { Voice.hush(); Sfx.stopAll(); }
        else { primeAudio(); Voice.unlock(); }
        break;
      case "wwTest":
        primeAudio(); Voice.unlock(); C.muted = false;
        Sfx.howl(); setTimeout(() => Voice.say(this.L().test), 1500);
        break;
      case "wwStart": primeAudio(); Voice.unlock(); this.start(); return "done";
      case "wwNightIntro": g.phase = "nightIntro"; top(); break;
      case "wwStartNight": this.startNight(); return "done";
      case "wwPick": {
        const i = +d.i, max = +d.max || 1, k = ui.sels.indexOf(i);
        if (k >= 0) ui.sels.splice(k, 1);
        else { ui.sels.push(i); if (ui.sels.length > max) ui.sels.shift(); }
        break;
      }
      case "wwChoose": {
        const step = g.steps[g.si], s = ui.sels.slice();
        if (!s.length) return "done";
        if (step === "cupid") { if (s.length !== 2) return "done"; g.lovers = s; save(); this.endStep(wwSeq); }
        else if (step === "wolves") { g.targets = s; save(); this.endStep(wwSeq); }
        else if (step === "doc") { g.saved = s[0]; g.lastSaved = s[0]; save(); this.endStep(wwSeq); }
        else if (step === "seer" || step === "appr") { ui.seerResult = s[0]; save(); render(); }
        return "done";
      }
      case "wwHeal": ui.wheal = ui.wheal === +d.i ? null : +d.i; break;
      case "wwPoisonMode": ui.wstage = "poison"; ui.sels = []; break;
      case "wwPoisonSet": if (ui.sels.length) ui.wpoison = ui.sels[0]; ui.wstage = null; ui.sels = []; break;
      case "wwPoisonBack": ui.wstage = null; ui.sels = []; break;
      case "wwPoisonClear": ui.wpoison = null; break;
      case "wwWitchDone":
        if (ui.wheal != null) { g.heal = ui.wheal; g.healUsed = true; }
        if (ui.wpoison != null) { g.poison = ui.wpoison; g.poisonUsed = true; }
        save(); this.endStep(wwSeq);
        return "done";
      case "wwEndStep":
        if (g.steps[g.si] === "doc" && !this.alive(g, "doc")) g.lastSaved = null;
        this.endStep(++wwSeq); return "done";
      case "wwShoot": if (ui.sels.length) this.hunterShoots(ui.sels[0]); return "done";
      case "wwToDay": this.stop(); Voice.unlock(); if (!this.settle()) this.toDay(); return "done";
      case "wwPause": primeAudio(); g.running ? SF.pause(g) : SF.resume(g); break;
      case "wwToVote": SF.pause(g); Voice.hush(); g.phase = "vote"; ui.sels = []; top(); break;
      case "wwVote": if (ui.sels.length) this.vote(ui.sels[0]); return "done";
      case "wwSkipVote": this.vote(null); return "done";
      case "wwNextNight": this.stop(); if (this.settle()) return "done"; g.night++; g.phase = "nightIntro"; ui.sels = []; top(); break;
      case "wwAgain": this.stop(); C.game = null; this.start(); return "done";
      default: return false;
    }
  }
};

const GAMES = { uc: UC, sf: SF, ww: WW };
const curGame = () => S.screen === "hub" ? null : S[S.screen].game;

// =====================================================================
// Render + events
// =====================================================================

let ticker = null;
function syncTicker() {
  clearInterval(ticker); ticker = null;
  const g = curGame();
  if (!g || !g.running) return;
  let onEnd, low = 60000;
  if (S.screen === "sf" && g.phase === "play") onEnd = () => SF.timeUp();
  else if (S.screen === "ww" && g.phase === "day") { onEnd = () => WW.timeUp(); low = 30000; }
  else return;
  const tick = () => {
    const ms = SF.left(g);
    const el = document.getElementById("timer");
    if (el) { el.textContent = SF.fmt(ms); el.classList.toggle("low", ms < low); }
    if (ms <= 0) { clearInterval(ticker); ticker = null; onEnd(); }
  };
  tick();
  if (ticker === null && g.running) ticker = setInterval(tick, 250);
}

function fail(msg) { ui.err = msg; render(); }

function render() {
  $app.className = "theme-" + S.screen;
  let html = S.screen === "hub" ? Hub.view() : GAMES[S.screen].view();
  if (ui.peek && curGame()) html += viewPeek();
  $app.innerHTML = html;
  syncTicker();
  const g = curGame();
  if (S.screen === "uc" && g && g.phase === "out" && g.roles[g.lastOut].role === "mw" && ui.guess !== "wrong" && !ui.peek) {
    document.getElementById("mw-guess")?.focus({ preventScroll: true });
  }
}

$app.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.player != null) { S.players[+t.dataset.player] = t.value; ui.err = ""; save(); }
  else if (t.dataset.custom) { S.uc.custom[t.dataset.custom] = t.value; save(); }
  else if (t.dataset.guess != null) { ui.guessText = t.value; }
});
$app.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.dataset.guess != null) { e.preventDefault(); act("ucGuess"); }
  else if (e.target.dataset.player != null) {
    e.preventDefault();
    const next = document.getElementById("p-" + (+e.target.dataset.player + 1));
    if (next) next.focus(); else act("add");
  }
});
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  act(b.dataset.act, b.dataset);
});

function act(a, d = {}) {
  if (ui.confirm && a !== ui.confirm) ui.confirm = null;
  const g = curGame();
  switch (a) {
    case "add":
      S.players.push(""); UC.resetCounts(); WW.autoWolves(); ui.err = ""; save(); render();
      document.getElementById("p-" + (S.players.length - 1))?.focus();
      return;
    case "rm": S.players.splice(+d.i, 1); UC.resetCounts(); WW.autoWolves(); ui.err = ""; break;
    case "open": S.screen = d.g; resetUi(); top(); break;
    case "hub": WW.stop(); S.screen = "hub"; resetUi(); top(); break;
    case "reset":
      if (ui.confirm === "reset") { S.scores = { uc: {}, sf: {}, ww: {} }; ui.confirm = null; } else ui.confirm = "reset";
      break;
    case "quit":
      if (ui.confirm === "quit") { WW.stop(); S[S.screen].game = null; resetUi(); top(); } else ui.confirm = "quit";
      break;
    case "peek": ui.peek = { i: +d.i, shown: false }; keepAwake(); break;
    case "show": ui.peek.shown = true; break;
    case "hide": g.roles[ui.peek.i].seen = true; ui.peek = null; break;
    case "closePeek": ui.peek = null; break;
    case "pick": ui.sel = +d.i; break;
    default: {
      // Game actions return "done" when they already saved and rendered, false when unknown.
      const r = GAMES[S.screen] ? GAMES[S.screen].act(a, d) : false;
      if (r === false || r === "done") return;
    }
  }
  save(); render();
}

render();

// Offline support when installed from the web (the standalone build links a manifest).
if ("serviceWorker" in navigator && location.protocol.startsWith("http") && document.querySelector('link[rel="manifest"]')) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
</body>
</html>
