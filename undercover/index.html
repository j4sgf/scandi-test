<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141830">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Undercover Night</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Saira+Condensed:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column like a case folder; the paper "dossier card" is the only light object on a night-indigo desk. Single dark look by choice. */
:root {
  --desk: #141830;
  --desk-2: #1c2142;
  --line: #2f3663;
  --fg: #e9ebf5;
  --muted: #9aa0c3;
  --paper: #efe7d4;
  --paper-ink: #2a2418;
  --lamp: #f0b443;
  --lamp-ink: #2a1d05;
  --spy: #e5604a;
  --ghost: #c9ccdf;
  --civ: #6fc3a8;
  --f-stamp: "Saira Stencil One", Impact, "Arial Black", sans-serif;
  --f-head: "Saira Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body {
  background: var(--desk);
  background-image: radial-gradient(ellipse 90% 50% at 50% -10%, #2b3170 0%, transparent 70%);
  background-attachment: fixed;
  color: var(--fg);
  font: 16px/1.5 var(--f-body);
  -webkit-tap-highlight-color: transparent;
}
#app {
  max-width: 560px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--f-stamp); font-size: clamp(2.3rem, 11vw, 3.4rem); line-height: .95; letter-spacing: .02em; color: var(--lamp); }
.tag { color: var(--muted); font-size: .95rem; }
.eyebrow { font-family: var(--f-head); font-weight: 600; text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; color: var(--muted); }
.title { font-family: var(--f-head); font-weight: 800; font-size: 1.9rem; line-height: 1.05; text-transform: uppercase; letter-spacing: .02em; }
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.panel { background: var(--desk-2); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.hint { color: var(--muted); font-size: .9rem; }
.err { color: var(--spy); font-weight: 600; font-size: .95rem; }

/* controls */
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 20px; border-radius: 12px; font-family: var(--f-head); font-weight: 800; font-size: 1.15rem; letter-spacing: .06em; text-transform: uppercase; transition: transform .08s ease, opacity .15s; }
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .35; cursor: not-allowed; }
.btn-main { background: var(--lamp); color: var(--lamp-ink); width: 100%; }
.btn-ghost { border: 1.5px solid var(--line); color: var(--fg); }
.btn-danger { background: var(--spy); color: #fff; width: 100%; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 140px; }
.link { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: .92rem; padding: 6px 0; }
input[type=text] { width: 100%; min-width: 0; min-height: 46px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--desk); color: var(--fg); font: inherit; }
input[type=text]::placeholder { color: #6a7099; }

/* players */
.plist { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.prow { display: grid; grid-template-columns: 26px 1fr 44px; align-items: center; gap: 8px; }
.seat { font-family: var(--f-head); font-weight: 800; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.x { width: 44px; height: 46px; border-radius: 10px; color: var(--muted); font-size: 1.4rem; line-height: 1; }
.x:hover { color: var(--spy); }

/* steppers */
.roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.role { background: var(--desk); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.role .n { font-family: var(--f-head); font-weight: 800; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.role .lbl { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.step { display: flex; gap: 6px; }
.step button { width: 38px; height: 34px; border-radius: 8px; border: 1px solid var(--line); font-size: 1.2rem; font-weight: 700; }
.step button[disabled] { opacity: .3; }
.c-civ { color: var(--civ); } .c-uc { color: var(--spy); } .c-mw { color: var(--ghost); }

/* segmented */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--desk); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.seg button { min-height: 42px; border-radius: 9px; font-weight: 600; font-size: .92rem; color: var(--muted); }
.seg button[aria-pressed=true] { background: var(--lamp); color: var(--lamp-ink); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* reveal grid */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.card { position: relative; min-height: 96px; border-radius: 12px; padding: 12px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; background: var(--paper); color: var(--paper-ink); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
.card .nm { font-family: var(--f-head); font-weight: 800; font-size: 1.3rem; line-height: 1.05; text-transform: uppercase; overflow-wrap: anywhere; }
.card .st { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; opacity: .65; }
.card.seen { background: var(--desk-2); color: var(--muted); border: 1px dashed var(--line); box-shadow: none; }
.card.seen .st { color: var(--civ); opacity: 1; }

/* order list */
.order { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; counter-reset: o; }
.order li { counter-increment: o; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--desk-2); border: 1px solid var(--line); font-weight: 600; }
.order li::before { content: counter(o); font-family: var(--f-head); font-weight: 800; color: var(--muted); width: 1.4em; text-align: right; font-variant-numeric: tabular-nums; }
.order li.first { border-color: var(--lamp); }
.order li .pill { margin-left: auto; }
.pill { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; padding: 3px 8px; border-radius: 99px; background: var(--lamp); color: var(--lamp-ink); white-space: nowrap; }
.pill.civ { background: var(--civ); color: #0d2a22; }
.pill.uc { background: var(--spy); color: #fff; }
.pill.mw { background: var(--ghost); color: #1a1c2a; }
.out-list { display: flex; flex-wrap: wrap; gap: 8px; }
.out-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
.out-chip s { text-decoration-thickness: 2px; }

/* vote */
.vote { display: flex; flex-direction: column; gap: 8px; }
.vote button { min-height: 54px; padding: 0 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--desk-2); text-align: left; font-weight: 600; font-size: 1.05rem; display: flex; align-items: center; justify-content: space-between; }
.vote button[aria-pressed=true] { border-color: var(--spy); background: color-mix(in srgb, var(--spy) 18%, var(--desk-2)); }
.vote button[aria-pressed=true]::after { content: "Out?"; font-family: var(--f-head); font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--spy); }

/* dossier (the hero object) */
.dossier { position: relative; background: var(--paper); color: var(--paper-ink); border-radius: 6px 6px 14px 14px; padding: 26px 20px 22px; box-shadow: 0 18px 40px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
.dossier::before { content: ""; position: absolute; top: -12px; left: 18px; width: 38%; height: 14px; background: var(--paper); border-radius: 8px 8px 0 0; }
.dossier .eyebrow { color: #7a6c50; }
.dossier .who { font-family: var(--f-head); font-weight: 800; font-size: clamp(1.8rem, 9vw, 2.6rem); line-height: 1; text-transform: uppercase; overflow-wrap: anywhere; }
.dossier .word { font-family: var(--f-stamp); font-size: clamp(2.2rem, 12vw, 3.6rem); line-height: 1; overflow-wrap: anywhere; padding: 6px 0; }
.dossier .note { font-size: .95rem; color: #5a4f3a; max-width: 34ch; }
.stamp { font-family: var(--f-stamp); font-size: clamp(1.6rem, 8vw, 2.3rem); padding: 4px 14px; border: 4px solid currentColor; border-radius: 8px; transform: rotate(-4deg); display: inline-block; line-height: 1.1; }
.stamp.civ { color: #23866a; } .stamp.uc { color: #c23b25; } .stamp.mw { color: #3c3f58; }

/* sheet overlay */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--desk); display: flex; align-items: center; justify-content: center; padding: calc(24px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet-inner { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 22px; }
.flip { animation: flip .35s ease-out; }
@keyframes flip { from { transform: perspective(800px) rotateY(80deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* score */
.score { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.score td { padding: 8px 4px; border-bottom: 1px solid var(--line); }
.score td:last-child { text-align: right; font-family: var(--f-head); font-weight: 800; font-size: 1.15rem; }
.score tr:last-child td { border-bottom: 0; }
.score .plus { color: var(--civ); font-size: .85rem; font-weight: 700; margin-left: 6px; }

details { background: var(--desk-2); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
details summary { cursor: pointer; padding: 10px 0; font-weight: 600; list-style-position: inside; }
details[open] summary { border-bottom: 1px solid var(--line); margin-bottom: 8px; }
details ol, details ul { margin: 0 0 12px; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; color: var(--muted); }
details b { color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-bottom: 12px; }
.chips button { padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line); font-weight: 600; font-size: .92rem; }
.center { text-align: center; align-items: center; }
.banner { font-family: var(--f-stamp); font-size: clamp(2rem, 10vw, 3rem); line-height: 1; color: var(--lamp); text-align: center; }
.words { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.words div { background: var(--desk-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.words b { display: block; font-family: var(--f-head); font-size: 1.4rem; text-transform: uppercase; overflow-wrap: anywhere; }

@media (prefers-reduced-motion: reduce) { .flip { animation: none; } .btn { transition: none; } }
</style>
</head>
<body>

<main id="app" aria-live="polite"></main>

<script>
(() => {
"use strict";

// ---------- word packs ----------
const PACKS = {
  en: { label: "English", pairs: [
    "Coffee|Tea","Cat|Dog","Beach|Pool","Pizza|Burger","Guitar|Violin","Sun|Moon","Doctor|Nurse","Train|Bus","Lion|Tiger","Apple|Pear",
    "Wine|Beer","Facebook|Instagram","Netflix|YouTube","Pen|Pencil","Chair|Stool","Shower|Bath","Spoon|Fork","Bicycle|Motorcycle","Piano|Organ","Rain|Snow",
    "Football|Rugby","Tennis|Badminton","Chess|Checkers","Wedding|Birthday party","Hotel|Hostel","Airport|Train station","Ketchup|Mayonnaise","Mermaid|Fairy","Vampire|Zombie","Batman|Spider-Man",
    "Harry Potter|Lord of the Rings","Ocean|Lake","Mountain|Hill","River|Waterfall","Knife|Scissors","Lipstick|Nail polish","Perfume|Deodorant","Watch|Bracelet","Ring|Necklace","Sushi|Sashimi",
    "Pancake|Waffle","Cake|Pie","Ice cream|Frozen yogurt","Chocolate|Candy","Honey|Syrup","Salt|Sugar","Bread|Toast","Rice|Noodles","Milk|Yogurt","Cheese|Butter",
    "Orange|Lemon","Strawberry|Cherry","Banana|Mango","Watermelon|Melon","Onion|Garlic","Cucumber|Zucchini","Elevator|Escalator","Window|Door","Pillow|Blanket","Bed|Hammock",
    "Toothbrush|Comb","Soap|Shampoo","Umbrella|Raincoat","Sneakers|Sandals","Hat|Helmet","Glasses|Sunglasses","Backpack|Suitcase","Wallet|Purse","Laptop|Tablet","iPhone|Android",
    "Camera|Binoculars","Headphones|Speakers","Email|Letter","Teacher|Professor","Police officer|Soldier","Chef|Waiter","Pilot|Astronaut","Singer|Actor","Magician|Clown","King|President",
    "Prince|Knight","Ghost|Skeleton","Dragon|Dinosaur","Shark|Dolphin","Eagle|Owl","Penguin|Duck","Frog|Lizard","Bee|Butterfly","Spider|Ant","Horse|Donkey",
    "Cow|Goat","Rabbit|Hamster","Monkey|Gorilla","Elephant|Rhino","Snake|Worm","Christmas|New Year","Halloween|Carnival","Valentine's Day|Anniversary","Library|Bookstore","Museum|Zoo",
    "Cinema|Theater","Gym|Yoga class","Hospital|Pharmacy","Bank|ATM","Supermarket|Market","Restaurant|Cafe","Park|Garden","Castle|Palace","Tent|Cabin","Submarine|Ship",
    "Rocket|Airplane","Car|Taxi","Map|Compass","Clock|Calendar","Candle|Lamp","Fire|Volcano","Earthquake|Tsunami","Star|Planet","Diamond|Gold","Paint|Crayon",
    "Puzzle|Lego","Doll|Teddy bear","Kite|Balloon","Swing|Slide","Skateboard|Scooter","Ski|Snowboard","Surfing|Swimming","Boxing|Wrestling","Basketball|Volleyball","Golf|Bowling",
    "Olympics|World Cup","Karaoke|Concert","Selfie|Portrait","Tattoo|Piercing","Beard|Moustache","Mirror|Window","Key|Lock","Hammer|Screwdriver","Ladder|Stairs","Bridge|Tunnel",
    "Coca-Cola|Pepsi","McDonald's|KFC","Disney|Pixar","Google|Wikipedia","WhatsApp|Telegram","TikTok|Snapchat"
  ]},
  id: { label: "Indonesia", pairs: [
    "Kopi|Teh","Nasi goreng|Mie goreng","Bakso|Mie ayam","Sate|Gulai","Rendang|Opor","Martabak|Terang bulan","Gado-gado|Pecel","Soto|Rawon","Tempe|Tahu","Kerupuk|Keripik",
    "Es teh|Es jeruk","Durian|Nangka","Mangga|Pepaya","Rambutan|Lengkeng","Pisang goreng|Bakwan","Ojek|Taksi","Angkot|Bus","KRL|MRT","Gojek|Grab","Tokopedia|Shopee",
    "Indomaret|Alfamart","Bali|Lombok","Jakarta|Surabaya","Borobudur|Prambanan","Pantai|Danau","Gunung|Bukit","Sawah|Kebun","Batik|Kebaya","Peci|Topi","Lebaran|Natal",
    "Mudik|Liburan","Ketupat|Lontong","Sambal|Kecap","Gula|Garam","Guru|Dosen","Dokter|Bidan","Polisi|Satpam","Presiden|Gubernur","Kucing|Anjing","Ayam|Bebek",
    "Cicak|Tokek","Nyamuk|Lalat","Komodo|Buaya","Harimau|Singa","Monyet|Orangutan","Gajah|Badak","Sepak bola|Futsal","Badminton|Tenis","Pencak silat|Karate","Dangdut|Keroncong",
    "Wayang|Boneka","Angklung|Gamelan","Gitar|Ukulele","Hujan|Banjir","Matahari|Bulan","Sendok|Garpu","Piring|Mangkuk","Bantal|Guling","Kipas angin|AC","Payung|Jas hujan",
    "Sandal|Sepatu","Motor|Sepeda","Pasar|Mal","Warteg|Restoran","Sekolah|Kampus","Sinetron|Drama Korea","Instagram|TikTok","WhatsApp|Telegram","Nikah|Tunangan","Arisan|Kondangan",
    "Siomay|Batagor","Cendol|Es campur","Kolak|Bubur","Nasi uduk|Nasi kuning","Seblak|Cilok","Kopi susu|Teh tarik","Bioskop|Konser","Masjid|Gereja","Becak|Bajaj","Kapal|Perahu"
  ]}
};

const ROLE = {
  civ: { name: "Civilian", pill: "civ" },
  uc:  { name: "Undercover", pill: "uc" },
  mw:  { name: "Mr. White", pill: "mw" }
};
const KEY = "undercover-night.v1";
const EXAMPLE_PLAYERS = ["Alex", "Sam", "Jordan", "Riley", "Casey"];

// ---------- state ----------
function fresh() {
  return { players: EXAMPLE_PLAYERS.slice(), uc: 1, mw: 1, pack: "en", custom: { civ: "", uc: "" }, scores: {}, used: { en: [], id: [] }, game: null };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return Object.assign(fresh(), JSON.parse(raw));
  } catch (e) {}
  return fresh();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

let S = load();
let ui = { peek: null, vote: null, guess: null, guessText: "", err: "", confirmReset: false, confirmQuit: false };

// ---------- helpers ----------
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rand = n => Math.floor(Math.random() * n);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");

function defaults(n) {
  return { uc: n <= 6 ? 1 : n <= 9 ? 2 : 3, mw: n <= 4 ? 0 : n <= 12 ? 1 : 2 };
}
function valid(n, uc, mw) {
  const civ = n - uc - mw;
  return uc >= 0 && mw >= 0 && uc + mw >= 1 && civ >= 2 && civ >= uc + mw;
}
function resetCounts() {
  const d = defaults(S.players.length);
  if (valid(S.players.length, d.uc, d.mw)) { S.uc = d.uc; S.mw = d.mw; }
  else { S.uc = 1; S.mw = 0; }
}

let wakeLock = null;
async function keepAwake() {
  if (wakeLock || !("wakeLock" in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } catch (e) {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.game) keepAwake(); });

// ---------- game logic ----------
function pickWords() {
  if (S.pack === "custom") return { civ: S.custom.civ.trim(), uc: S.custom.uc.trim() };
  const pairs = PACKS[S.pack].pairs;
  let used = S.used[S.pack] || [];
  if (used.length >= pairs.length) used = [];
  const left = pairs.map((_, i) => i).filter(i => !used.includes(i));
  const idx = left[rand(left.length)];
  S.used[S.pack] = used.concat(idx);
  let [a, b] = pairs[idx].split("|");
  if (Math.random() < .5) [a, b] = [b, a];
  return { civ: a, uc: b };
}

function startGame() {
  const names = S.players.map(s => s.trim());
  if (names.length < 3) return fail("You need at least 3 players.");
  if (names.some(n => !n)) return fail("Every player needs a name.");
  const lower = names.map(n => n.toLowerCase());
  if (new Set(lower).size !== lower.length) return fail("Two players have the same name. Make each one different.");
  if (!valid(names.length, S.uc, S.mw)) return fail("That role mix doesn't work. Keep at least as many civilians as infiltrators.");
  if (S.pack === "custom" && (!S.custom.civ.trim() || !S.custom.uc.trim())) return fail("Enter both custom words, or pick a word pack.");
  if (S.pack === "custom" && norm(S.custom.civ) === norm(S.custom.uc)) return fail("The two custom words need to be different.");
  S.players = names;
  const words = pickWords();
  const roles = shuffle([
    ...Array(S.uc).fill("uc"),
    ...Array(S.mw).fill("mw"),
    ...Array(names.length - S.uc - S.mw).fill("civ")
  ]);
  S.game = {
    words, round: 1, phase: "reveal", order: [], lastOut: null, winner: null, awards: {},
    roles: names.map((name, i) => ({ name, role: roles[i], alive: true, seen: false }))
  };
  ui = { peek: null, vote: null, guess: null, guessText: "", err: "", confirmReset: false, confirmQuit: false };
  keepAwake();
  save(); render(); window.scrollTo(0, 0);
}
function fail(msg) { ui.err = msg; render(); }

function makeOrder() {
  const g = S.game;
  const alive = g.roles.map((r, i) => i).filter(i => g.roles[i].alive);
  // Mr. White never opens the round.
  const starters = alive.filter(i => g.roles[i].role !== "mw");
  const first = starters[rand(starters.length)];
  const k = alive.indexOf(first);
  return alive.slice(k).concat(alive.slice(0, k));
}

function counts() {
  const c = { civ: 0, uc: 0, mw: 0 };
  S.game.roles.forEach(r => { if (r.alive) c[r.role]++; });
  return c;
}
function checkWin() {
  const c = counts();
  if (c.uc + c.mw === 0) return "civ";
  if (c.civ <= 1) return "imp";
  return null;
}
function finish(win) {
  const g = S.game;
  g.winner = win; g.phase = "over"; g.awards = {};
  g.roles.forEach((r, i) => {
    let pts = 0;
    if (win === "civ" && r.role === "civ") pts = 2;
    if (win === "mw" && i === g.lastOut) pts = 6;
    if (win === "imp" && r.alive && r.role === "uc") pts = 10;
    if (win === "imp" && r.alive && r.role === "mw") pts = 6;
    if (pts) { g.awards[i] = pts; S.scores[r.name] = (S.scores[r.name] || 0) + pts; }
  });
}
function nextRound() {
  const win = checkWin();
  if (win) finish(win);
  else { const g = S.game; g.round++; g.order = makeOrder(); g.phase = "clues"; }
  ui.vote = null; ui.guess = null; ui.guessText = "";
  save(); render(); window.scrollTo(0, 0);
}

// ---------- views ----------
function header(sub) {
  return `<header class="brand"><div class="logo">UNDERCOVER</div><div class="tag">${sub}</div></header>`;
}

function viewSetup() {
  const n = S.players.length;
  const civ = n - S.uc - S.mw;
  const can = (uc, mw) => valid(n, uc, mw);
  const scores = Object.entries(S.scores).sort((a, b) => b[1] - a[1]);
  return `
  ${header("One phone, passed around the room.")}

  <section class="section">
    <div class="section-head"><h2 class="title">Players</h2><span class="eyebrow">${n} at the table</span></div>
    <p class="hint">Enter names in the order you're sitting, so the clue order goes around the circle.</p>
    <ol class="plist">
      ${S.players.map((p, i) => `
        <li class="prow">
          <span class="seat">${i + 1}</span>
          <input type="text" id="p-${i}" data-player="${i}" value="${esc(p)}" placeholder="Player ${i + 1}" maxlength="18" autocomplete="off" aria-label="Player ${i + 1} name">
          <button class="x" data-act="rm" data-i="${i}" aria-label="Remove ${esc(p || "player")}" ${n <= 3 ? "disabled" : ""}>&times;</button>
        </li>`).join("")}
    </ol>
    <button class="btn btn-ghost" data-act="add" ${n >= 20 ? "disabled" : ""}>Add player</button>
  </section>

  <section class="section">
    <div class="section-head"><h2 class="title">Roles</h2><button class="link" data-act="auto">Suggested mix</button></div>
    <div class="roles">
      <div class="role"><span class="n c-civ">${civ}</span><span class="lbl">Civilians</span><span class="hint" style="font-size:.75rem">the rest</span></div>
      <div class="role"><span class="n c-uc">${S.uc}</span><span class="lbl">Undercover</span>
        <div class="step"><button data-act="uc-" aria-label="Fewer undercover" ${can(S.uc - 1, S.mw) ? "" : "disabled"}>&minus;</button><button data-act="uc+" aria-label="More undercover" ${can(S.uc + 1, S.mw) ? "" : "disabled"}>+</button></div></div>
      <div class="role"><span class="n c-mw">${S.mw}</span><span class="lbl">Mr. White</span>
        <div class="step"><button data-act="mw-" aria-label="Fewer Mr. White" ${can(S.uc, S.mw - 1) ? "" : "disabled"}>&minus;</button><button data-act="mw+" aria-label="More Mr. White" ${can(S.uc, S.mw + 1) ? "" : "disabled"}>+</button></div></div>
    </div>
  </section>

  <section class="section">
    <h2 class="title">Words</h2>
    <div class="seg" role="group" aria-label="Word pack">
      <button data-act="pack" data-pack="en" aria-pressed="${S.pack === "en"}">English</button>
      <button data-act="pack" data-pack="id" aria-pressed="${S.pack === "id"}">Indonesia</button>
      <button data-act="pack" data-pack="custom" aria-pressed="${S.pack === "custom"}">Custom</button>
    </div>
    ${S.pack === "custom" ? `
      <p class="hint">Have someone who's sitting out type a pair of similar words.</p>
      <div class="two">
        <input type="text" id="cw-civ" data-custom="civ" value="${esc(S.custom.civ)}" placeholder="Civilian word" autocomplete="off" aria-label="Civilian word">
        <input type="text" id="cw-uc" data-custom="uc" value="${esc(S.custom.uc)}" placeholder="Undercover word" autocomplete="off" aria-label="Undercover word">
      </div>` : `<p class="hint">${PACKS[S.pack].pairs.length} word pairs. A random pair is picked each game, with no repeats until the pack runs out.</p>`}
  </section>

  ${ui.err ? `<p class="err" role="alert">${esc(ui.err)}</p>` : ""}
  <button class="btn btn-main" data-act="start">Deal the roles</button>

  ${scores.length ? `
  <section class="section">
    <div class="section-head"><h2 class="title">Scoreboard</h2>
      <button class="link" data-act="reset">${ui.confirmReset ? "Tap again to clear scores" : "Clear scores"}</button></div>
    <div class="panel"><table class="score"><tbody>
      ${scores.map(([name, pts]) => `<tr><td>${esc(name)}</td><td>${pts}</td></tr>`).join("")}
    </tbody></table></div>
  </section>` : ""}

  <details>
    <summary>How to play</summary>
    <ol>
      <li><b>Deal.</b> Pass the phone around. Each player taps their name and secretly reads their word.</li>
      <li><b>Civilians</b> all share the same word. The <b>Undercover</b> gets a similar but different word and doesn't know they're undercover. <b>Mr. White</b> gets no word at all.</li>
      <li><b>Clues.</b> Going around in the order shown, everyone says one word or short phrase about their word. Too vague and you look suspicious; too obvious and you help the infiltrators.</li>
      <li><b>Vote.</b> Everyone points at who they suspect at the same time. The player with the most votes is out and their role is revealed. On a tie, the tied players give one more clue and you vote again.</li>
      <li><b>Mr. White's last chance.</b> If Mr. White is voted out, they get one guess at the civilians' word. Guess right and they win outright.</li>
      <li><b>Winning.</b> Civilians win when every Undercover and Mr. White is out. The infiltrators win if they survive until only one civilian is left.</li>
    </ol>
    <ul>
      <li>Points: civilians 2 each on a win, Mr. White 6, each surviving Undercover 10.</li>
    </ul>
  </details>`;
}

function viewReveal() {
  const g = S.game;
  const left = g.roles.filter(r => !r.seen).length;
  return `
  ${header("Dealing the roles")}
  <section class="section">
    <p class="eyebrow">Step 1 of 3</p>
    <h2 class="title">Pass the phone</h2>
    <p class="hint">Each player taps their own name, reads their word in private, then hides it before passing on.</p>
  </section>
  <div class="cards">
    ${g.roles.map((r, i) => `
      <button class="card ${r.seen ? "seen" : ""}" data-act="peek" data-i="${i}">
        <span class="nm">${esc(r.name)}</span>
        <span class="st">${r.seen ? "Checked" : "Tap to see word"}</span>
      </button>`).join("")}
  </div>
  ${left ? `<p class="hint center">${left} still to look.</p>` : ""}
  <button class="btn btn-main" data-act="toClues" ${left ? "disabled" : ""}>Everyone's ready</button>
  ${quitLink()}`;
}

function viewClues() {
  const g = S.game;
  const out = g.roles.filter(r => !r.alive);
  return `
  ${header(`Round ${g.round}`)}
  <section class="section">
    <p class="eyebrow">Step 2 of 3 &middot; Round ${g.round}</p>
    <h2 class="title">Give your clues</h2>
    <p class="hint">One word or short phrase each, in this order. No repeating a clue someone already said.</p>
  </section>
  <ol class="order">
    ${g.order.map((i, k) => `<li class="${k === 0 ? "first" : ""}">${esc(g.roles[i].name)}${k === 0 ? `<span class="pill">Starts</span>` : ""}</li>`).join("")}
  </ol>
  ${out.length ? `
  <section class="section">
    <span class="eyebrow">Out of the game</span>
    <div class="out-list">${out.map(r => `<span class="out-chip"><s>${esc(r.name)}</s><span class="pill ${ROLE[r.role].pill}">${ROLE[r.role].name}</span></span>`).join("")}</div>
  </section>` : ""}
  <button class="btn btn-main" data-act="toVote">Time to vote</button>
  <details>
    <summary>Forgot your word?</summary>
    <div class="chips">${g.order.map(i => `<button data-act="peek" data-i="${i}">${esc(g.roles[i].name)}</button>`).join("")}</div>
  </details>
  ${quitLink()}`;
}

function viewVote() {
  const g = S.game;
  const sel = ui.vote;
  return `
  ${header(`Round ${g.round}`)}
  <section class="section">
    <p class="eyebrow">Step 3 of 3 &middot; Round ${g.round}</p>
    <h2 class="title">Who's out?</h2>
    <p class="hint">On three, everyone points at their suspect. Tap whoever got the most votes. On a tie, the tied players give one more clue and you vote again.</p>
  </section>
  <div class="vote" role="group" aria-label="Players still in">
    ${g.order.map(i => `<button data-act="pick" data-i="${i}" aria-pressed="${sel === i}">${esc(g.roles[i].name)}</button>`).join("")}
  </div>
  <button class="btn btn-danger" data-act="eliminate" ${sel == null ? "disabled" : ""}>${sel == null ? "Pick a player" : `Vote out ${esc(g.roles[sel].name)}`}</button>
  <button class="btn btn-ghost" data-act="backClues">Back to clues</button>`;
}

function viewOut() {
  const g = S.game;
  const r = g.roles[g.lastOut];
  const isMW = r.role === "mw";
  const article = r.role === "uc" ? "an" : "a";
  let body;
  if (isMW && ui.guess !== "wrong") {
    body = `
      <p class="note">Mr. White, you get one guess at the civilians' word. Get it right and you win.</p>
      <input type="text" id="mw-guess" data-guess value="${esc(ui.guessText)}" placeholder="Your guess" autocomplete="off" aria-label="Mr. White's guess" style="background:#fffaf0;color:var(--paper-ink);border-color:#cbbf9f">`;
  } else if (isMW) {
    body = `<p class="note"><b>Wrong guess.</b> Civilians, if that was just a typo or a close spelling of your word, you can count it.</p>`;
  } else {
    body = `<p class="note">${r.role === "civ" ? "Ouch. An innocent civilian is gone." : "Nice work. One infiltrator down."}</p>`;
  }
  const actions = isMW && ui.guess !== "wrong"
    ? `<button class="btn btn-main" data-act="guess">Lock in guess</button>`
    : isMW
      ? `<div class="btn-row"><button class="btn btn-ghost" data-act="guessOk">Count it</button><button class="btn btn-main" data-act="continue">Keep playing</button></div>`
      : `<button class="btn btn-main" data-act="continue">Continue</button>`;
  return `
  ${header(`Round ${g.round}`)}
  <div class="dossier flip" style="margin-top:12px">
    <span class="eyebrow">Voted out</span>
    <span class="who">${esc(r.name)}</span>
    <span class="note">was ${isMW ? "" : article}</span>
    <span class="stamp ${ROLE[r.role].pill}">${ROLE[r.role].name.toUpperCase()}</span>
    ${body}
  </div>
  ${actions}`;
}

function viewOver() {
  const g = S.game;
  const c = counts();
  let banner;
  if (g.winner === "civ") banner = "Civilians win";
  else if (g.winner === "mw") banner = "Mr. White wins";
  else if (c.uc && c.mw) banner = "Infiltrators win";
  else if (c.uc) banner = c.uc > 1 ? "Undercovers win" : "Undercover wins";
  else banner = "Mr. White wins";
  const sorted = Object.entries(S.scores).sort((a, b) => b[1] - a[1]);
  const awardBy = {};
  g.roles.forEach((r, i) => { if (g.awards[i]) awardBy[r.name] = g.awards[i]; });
  return `
  ${header(`Game over after ${g.round} round${g.round > 1 ? "s" : ""}`)}
  <div class="banner">${banner}</div>
  <div class="words">
    <div><span class="eyebrow">Civilian word</span><b class="c-civ">${esc(g.words.civ)}</b></div>
    <div><span class="eyebrow">Undercover word</span><b class="c-uc">${esc(g.words.uc)}</b></div>
  </div>
  <section class="section">
    <span class="eyebrow">Who was who</span>
    <ol class="order">
      ${g.roles.map(r => `<li>${r.alive ? esc(r.name) : `<s>${esc(r.name)}</s>`}<span class="pill ${ROLE[r.role].pill}">${ROLE[r.role].name}</span></li>`).join("")}
    </ol>
  </section>
  <section class="section">
    <span class="eyebrow">Scoreboard</span>
    <div class="panel"><table class="score"><tbody>
      ${sorted.map(([name, pts]) => `<tr><td>${esc(name)}${awardBy[name] ? `<span class="plus">+${awardBy[name]}</span>` : ""}</td><td>${pts}</td></tr>`).join("")}
    </tbody></table></div>
  </section>
  <div class="btn-row">
    <button class="btn btn-ghost" data-act="toSetup">Change players</button>
    <button class="btn btn-main" data-act="again">Play again</button>
  </div>`;
}

function quitLink() {
  return `<button class="link" data-act="quit" style="align-self:center">${ui.confirmQuit ? "Tap again to end this game" : "End game and go back to setup"}</button>`;
}

function viewPeek() {
  const g = S.game;
  const r = g.roles[ui.peek.i];
  if (!ui.peek.shown) {
    return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Pass the phone"><div class="sheet-inner center">
      <span class="eyebrow">Hand the phone to</span>
      <div class="title" style="font-size:2.6rem;overflow-wrap:anywhere">${esc(r.name)}</div>
      <p class="hint">Make sure nobody else can see the screen.</p>
      <button class="btn btn-main" data-act="show">I'm ${esc(r.name)}, show me</button>
      <button class="link" data-act="closePeek">Cancel</button>
    </div></div>`;
  }
  const mw = r.role === "mw";
  return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Your secret word"><div class="sheet-inner">
    <div class="dossier flip">
      <span class="eyebrow">Top secret &middot; ${esc(r.name)}</span>
      ${mw
        ? `<span class="stamp mw" style="margin:10px 0">MR. WHITE</span>
           <p class="note">You have no word. Listen to the clues, blend in, and work out what the civilians' word is.</p>`
        : `<span class="note">Your word is</span>
           <span class="word">${esc(r.role === "civ" ? g.words.civ : g.words.uc)}</span>
           <p class="note">Keep it to yourself. Someone at the table has a slightly different word.</p>`}
    </div>
    <button class="btn btn-main" data-act="hide">Got it, hide</button>
  </div></div>`;
}

function render() {
  const g = S.game;
  let html;
  if (!g) html = viewSetup();
  else html = ({ reveal: viewReveal, clues: viewClues, vote: viewVote, out: viewOut, over: viewOver })[g.phase]();
  if (g && ui.peek) html += viewPeek();
  $app.innerHTML = html;
  if (g && g.phase === "out" && g.roles[g.lastOut].role === "mw" && ui.guess !== "wrong") {
    const el = document.getElementById("mw-guess");
    if (el && !ui.peek) el.focus({ preventScroll: true });
  }
}

// ---------- events ----------
$app.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.player != null) { S.players[+t.dataset.player] = t.value; ui.err = ""; save(); }
  else if (t.dataset.custom) { S.custom[t.dataset.custom] = t.value; save(); }
  else if (t.dataset.guess != null) { ui.guessText = t.value; }
});
$app.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  if (e.target.dataset.guess != null) { e.preventDefault(); act("guess"); }
  else if (e.target.dataset.player != null) {
    e.preventDefault();
    const i = +e.target.dataset.player;
    const next = document.getElementById("p-" + (i + 1));
    if (next) next.focus(); else act("add");
  }
});
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  act(b.dataset.act, b.dataset);
});

function act(a, d = {}) {
  const g = S.game;
  if (a !== "reset") ui.confirmReset = false;
  if (a !== "quit") ui.confirmQuit = false;
  switch (a) {
    case "add":
      S.players.push(""); resetCounts(); ui.err = ""; save(); render();
      document.getElementById("p-" + (S.players.length - 1))?.focus();
      return;
    case "rm": S.players.splice(+d.i, 1); resetCounts(); ui.err = ""; break;
    case "auto": resetCounts(); break;
    case "uc+": S.uc++; break;
    case "uc-": S.uc--; break;
    case "mw+": S.mw++; break;
    case "mw-": S.mw--; break;
    case "pack": S.pack = d.pack; ui.err = ""; break;
    case "start": return startGame();
    case "reset":
      if (ui.confirmReset) { S.scores = {}; ui.confirmReset = false; } else ui.confirmReset = true;
      break;
    case "quit":
      if (ui.confirmQuit) { S.game = null; ui.confirmQuit = false; } else ui.confirmQuit = true;
      break;
    case "peek": ui.peek = { i: +d.i, shown: false }; keepAwake(); break;
    case "show": ui.peek.shown = true; break;
    case "hide": g.roles[ui.peek.i].seen = true; ui.peek = null; break;
    case "closePeek": ui.peek = null; break;
    case "toClues": g.order = makeOrder(); g.phase = "clues"; break;
    case "toVote": g.phase = "vote"; ui.vote = null; break;
    case "backClues": g.phase = "clues"; break;
    case "pick": ui.vote = +d.i; break;
    case "eliminate":
      g.roles[ui.vote].alive = false; g.lastOut = ui.vote; g.phase = "out";
      ui.vote = null; ui.guess = null; ui.guessText = "";
      break;
    case "guess":
      if (!ui.guessText.trim()) return;
      if (norm(ui.guessText) === norm(g.words.civ)) { finish("mw"); }
      else ui.guess = "wrong";
      break;
    case "guessOk": finish("mw"); break;
    case "continue": return nextRound();
    case "again": S.game = null; return startGame();
    case "toSetup": S.game = null; break;
  }
  save(); render();
  if (["toClues", "toVote", "backClues", "eliminate", "guess", "guessOk", "toSetup"].includes(a)) window.scrollTo(0, 0);
}

render();
})();
</script>
</body>
</html>
